<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) rotate(90) scale(300)">
      <stop stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Geliştirme Döngüsü</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Her turda yalnızca tek bir şeyi değiştirin</text>

  <!-- dongu oku -->
  <g stroke-linecap="round">
    <path d="M240 330 C 300 240, 460 220, 580 250" stroke="#22d3ee" stroke-width="5" fill="none"/>
    <path d="M580 250 l-22 -6 l12 20 z" fill="#22d3ee"/>
    <path d="M640 260 C 760 300, 820 380, 780 450" stroke="#a855f7" stroke-width="5" fill="none"/>
    <path d="M780 450 l22 4 l-16 16 z" fill="#a855f7"/>
    <path d="M740 470 C 620 520, 420 500, 320 430" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <path d="M320 430 l-2 24 l-18 -14 z" fill="#f59e0b"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="140" y="290" width="240" height="100" rx="16" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
    <text x="170" y="332" font-size="23" font-weight="800" fill="#67e8f9">1. Yaz</text>
    <text x="170" y="366" font-size="16" fill="#94a3b8">rol + bağlam + format</text>

    <rect x="510" y="180" width="240" height="100" rx="16" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
    <text x="540" y="222" font-size="23" font-weight="800" fill="#c4b5fd">2. Ölç</text>
    <text x="540" y="256" font-size="16" fill="#94a3b8">doğruluk · uzunluk · format</text>

    <rect x="760" y="400" width="240" height="100" rx="16" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
    <text x="790" y="442" font-size="23" font-weight="800" fill="#fbbf24">3. Tekrar</text>
    <text x="790" y="476" font-size="16" fill="#94a3b8">tek değişken, yeni tur</text>

    <rect x="430" y="330" width="340" height="140" rx="18" fill="#132033" stroke="#4ade80" stroke-width="2"/>
    <text x="460" y="374" font-size="22" font-weight="800" fill="#86efac">Kazanan promptu kaydedin</text>
    <text x="460" y="410" font-size="17" fill="#e2e8f0">referans dosya + değişkenler</text>
    <text x="460" y="440" font-size="17" fill="#94a3b8">bir sonraki kullanımda sıfırdan başlamayın</text>
  </g>

  <g fill="#4ade80" opacity="0.8"><circle cx="1150" cy="140" r="4"/><circle cx="360" cy="180" r="3"/></g>
</svg>
