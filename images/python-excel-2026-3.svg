<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(330)">
      <stop stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Veri Temizleme: 4 Kontrol</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ham dosya her zaman kirli olur</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="190" width="510" height="96" rx="12" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="96" y="228" font-size="21" font-weight="800" fill="#67e8f9">1 · Bak</text>
      <text x="96" y="258" font-size="17" fill="#94a3b8">df.info() · isna().sum() · head()</text>
      <rect x="70" y="298" width="510" height="96" rx="12" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="96" y="336" font-size="21" font-weight="800" fill="#86efac">2 · Tipi sabitle</text>
      <text x="96" y="366" font-size="17" fill="#94a3b8">to_datetime(dayfirst) · to_numeric(coerce)</text>
      <rect x="70" y="406" width="510" height="96" rx="12" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="96" y="444" font-size="21" font-weight="800" fill="#fbbf24">3 · Temizle</text>
      <text x="96" y="474" font-size="17" fill="#94a3b8">drop_duplicates · fillna · dropna(subset)</text>
    </g>

    <g>
      <rect x="620" y="190" width="510" height="96" rx="12" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="646" y="228" font-size="21" font-weight="800" fill="#c4b5fd">4 · Özetle</text>
      <text x="646" y="258" font-size="17" fill="#94a3b8">groupby().agg() · pivot_table()</text>
      <rect x="620" y="298" width="510" height="96" rx="12" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="646" y="336" font-size="21" font-weight="800" fill="#fca5a5">En sık 2 tuzak</text>
      <text x="646" y="366" font-size="17" fill="#94a3b8">Tarih string kalır · sep/encoding yanlış</text>
      <rect x="620" y="406" width="510" height="96" rx="12" fill="#0c1526" stroke="#94a3b8" stroke-width="2"/>
      <text x="646" y="444" font-size="21" font-weight="800" fill="#cbd5e1">Büyük dosya</text>
      <text x="646" y="474" font-size="17" fill="#94a3b8">chunksize + usecols ile belleği koru</text>
    </g>

    <rect x="70" y="530" width="1060" height="48" rx="12" fill="#0f2b1e" stroke="#4ade80" stroke-width="2"/>
    <text x="98" y="561" font-size="19" font-weight="700" fill="#86efac">Sonucu her zaman yeni dosyaya yaz — ham veriye dokunma</text>
  </g>
</svg>
