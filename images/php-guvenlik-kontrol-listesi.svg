<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f6f9fc"/><text x="60" y="68" fill="#102a43" font-family="Arial" font-size="28" font-weight="700">Son kontrol: bu beş kutuyu işaretleyin</text><g font-family="Arial" font-size="19" fill="#24415c"><g><rect x="75" y="120" width="470" height="105" rx="18" fill="#fff" stroke="#d9e4ee" stroke-width="2"/><rect x="110" y="154" width="36" height="36" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="170" y="178">PHP kullanan siteleri envantere aldım</text></g><g><rect x="655" y="120" width="470" height="105" rx="18" fill="#fff" stroke="#d9e4ee" stroke-width="2"/><rect x="690" y="154" width="36" height="36" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="750" y="178">Yama durumunu sağlayıcıdan doğruladım</text></g><g><rect x="75" y="265" width="470" height="105" rx="18" fill="#fff" stroke="#d9e4ee" stroke-width="2"/><rect x="110" y="299" width="36" height="36" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="170" y="323">Güncellemeyi ve servis yenilemeyi yaptım</text></g><g><rect x="655" y="265" width="470" height="105" rx="18" fill="#fff" stroke="#d9e4ee" stroke-width="2"/><rect x="690" y="299" width="36" height="36" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="750" y="323">Siteyi ve olağan dışı kayıtları inceledim</text></g></g><text x="600" y="440" text-anchor="middle" fill="#647b90" font-family="Arial" font-size="17">Tamamlandıysa güncelleme kaydını saklayın; emin değilseniz hosting desteğine başvurun.</text></svg>