<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Cisco SD-WAN güvenlik kontrol listesi</title><desc id="d">Ürün yazılımını güncelleme, erişimi sınırlama, IOC avı ve olay müdahalesi adımları</desc><rect width="1200" height="390" rx="28" fill="#101d35"/><text x="52" y="68" fill="#9cf5e7" font-family="Arial" font-size="20" font-weight="700" letter-spacing="3">KURUMSAL EKİPLER İÇİN İLK KONTROL</text><g font-family="Arial"><g transform="translate(55 115)"><circle cx="28" cy="28" r="25" fill="#174c57"/><path d="m16 28 9 9 18-20" fill="none" stroke="#8ef3df" stroke-width="5" stroke-linecap="round"/><text x="75" y="24" fill="white" font-size="21" font-weight="700">Sabit sürüme geç</text><text x="75" y="54" fill="#b8c8dc" font-size="16">Sürümünü Cisco advisory tablosundan doğrula.</text></g><g transform="translate(630 115)"><circle cx="28" cy="28" r="25" fill="#174c57"/><path d="m16 28 9 9 18-20" fill="none" stroke="#8ef3df" stroke-width="5" stroke-linecap="round"/><text x="75" y="24" fill="white" font-size="21" font-weight="700">Erişimi daralt</text><text x="75" y="54" fill="#b8c8dc" font-size="16">Kontrol bileşenlerini bilinen IP'lerle sınırla.</text></g><g transform="translate(55 230)"><circle cx="28" cy="28" r="25" fill="#392a58"/><path d="M28 12v20m0 10v2" stroke="#ffcf71" stroke-width="5" stroke-linecap="round"/><text x="75" y="24" fill="white" font-size="21" font-weight="700">Kompromi belirtisi ara</text><text x="75" y="54" fill="#b8c8dc" font-size="16">Yeni peer, olağandışı servis ve logları incele.</text></g><g transform="translate(630 230)"><circle cx="28" cy="28" r="25" fill="#392a58"/><path d="M28 12v20m0 10v2" stroke="#ffcf71" stroke-width="5" stroke-linecap="round"/><text x="75" y="24" fill="white" font-size="21" font-weight="700">Olay varsa müdahale et</text><text x="75" y="54" fill="#b8c8dc" font-size="16">Sadece yamalamak, ihlali temizlediğini kanıtlamaz.</text></g></g></s