    </radialGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#4ade80"/>
