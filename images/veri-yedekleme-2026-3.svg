      <text x="656" y="342" font-size="18" fill="#94a3b8">SSD ve HDD sessizce ölebilir</text>
    </g>
    <g>
      <rect x="632" y="362" width="416" height="66" rx="12" fill="#132033"/>
      <text x="656" y="392" font-size="21" font-weight="800" fill="#38bdf8">Yanlışlıkla silme</text>
      <text x="656" y="418" font-size="18" fill="#94a3b8">Shift+Delete geri getirmez</text>
    </g>
  </g>

  <text x="632" y="490" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Çözüm: bağlantısı kesilmiş, uzakta bir kopya</text>

  <g fill="#f87171" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="520" cy="500" r="4"/><circle cx="1160" cy="130" r="3"/></g>
