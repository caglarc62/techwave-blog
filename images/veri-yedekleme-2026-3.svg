<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12162f"/>
      <stop offset="1" stop-color="#1b1f4a"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#f87171" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#f87171"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fca5a5" letter-spacing="3">TEHDİT MODELİ</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Yedek Neden</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#e2e8f0">Bozulur?</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Fidye yazılımı · Bozuk disk · Silinmiş dosya</text>

  <rect x="600" y="140" width="480" height="320" rx="20" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
  <text x="632" y="186" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b" letter-spacing="3">YAYGIN SENARYOLAR</text>

  <g font-family="Inter, Arial, sans-serif" font-size="20">
    <g>
      <rect x="632" y="210" width="416" height="66" rx="12" fill="#132033"/>
      <text x="656" y="240" font-size="21" font-weight="800" fill="#f87171">Fidye yazılımı</text>
      <text x="656" y="266" font-size="18" fill="#94a3b8">Bağlantılı diskler de şifrelenir</text>
    </g>
    <g>
      <rect x="632" y="286" width="416" height="66" rx="12" fill="#132033"/>
