<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#f87171" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA)"/>
  <rect width="1200" height="600" fill="url(#glowA)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#f87171"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fca5a5" letter-spacing="3">DONANIM BAKIMI</text>
  <text x="104" y="310" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Isınma ve Termal Bakım</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Sıcaklığı Düşürmenin Yolu</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Toz · Macun · Hava akışı · Fan eğrisi</text>

  <!-- sicaklik cubugu -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="620" y="130" width="510" height="340" rx="20" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
    <text x="652" y="176" font-size="21" font-weight="700" fill="#64748b" letter-spacing="3">SIÇAKLIK ÖLÇEĞİ (CPU)</text>

    <rect x="652" y="200" width="446" height="26" rx="13" fill="url(#barA)"/>
    <g font-size="17" font-weight="700">
      <text x="652" y="256" fill="#67e8f9">30-45° boşta</text>
      <text x="820" y="256" fill="#fbbf24">60-80° normal</text>
      <text x="990" y="256" fill="#fca5a5">95°+ risk</text>
    </g>

    <g>
      <rect x="652" y="292" width="446" height="52" rx="10" fill="#132033" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="676" y="325" font-size="19" fill="#e2e8f9">Sorun değil: anlık sıçramalar</text>
      <rect x="652" y="356" width="446" height="52" rx="10" fill="#132033" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="676" y="389" font-size="19" fill="#e2e8f9">Dikkat: sürekli yükseklik</text>
      <rect x="652" y="420" width="446" height="34" rx="10" fill="#132033" stroke="#f87171" stroke-width="1.5"/>
      <text x="676" y="443" font-size="18" font-weight="700" fill="#fca5a5">Termal yavaşlama başlar</text>
    </g>
  </g>

  <g fill="#f87171" opacity="0.85"><circle cx="150" cy="130" r="4"/><circle cx="540" cy="500" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
