<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#0e1a2b"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(340 300) rotate(90) scale(300)">
      <stop stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelD" x1="550" y1="110" x2="1120" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151d33"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <rect x="70" y="208" width="8" height="150" rx="4" fill="#fbbf24"/>
  <text x="104" y="250" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fcd34d" letter-spacing="3">KONTROL LİSTESİ</text>
  <text x="104" y="312" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">10 Dakikada</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0">Gizlilik Denetimi</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ayarlar → Gizlilik ve güvenlik</text>

  <rect x="550" y="110" width="570" height="380" rx="20" fill="url(#panelD)" stroke="#1e293b" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="21">
    <g>
      <circle cx="596" cy="156" r="17" fill="#4ade80"/>
      <path d="M589 156 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="163" fill="#e2e8f0">Reklam kimliğini kapatın</text>
    </g>
    <g>
      <circle cx="596" cy="210" r="17" fill="#4ade80"/>
      <path d="M589 210 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="217" fill="#e2e8f0">Tanılama verisini "İsteğe bağlı" yapın</text>
    </g>
    <g>
      <circle cx="596" cy="264" r="17" fill="#4ade80"/>
      <path d="M589 264 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="271" fill="#e2e8f0">Etkinlik geçmişini kapatın</text>
    </g>
    <g>
      <circle cx="596" cy="318" r="17" fill="#4ade80"/>
      <path d="M589 318 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="325" fill="#e2e8f0">Konum iznini uygulama bazında verin</text>
    </g>
    <g>
      <circle cx="596" cy="372" r="17" fill="#4ade80"/>
      <path d="M589 372 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="379" fill="#e2e8f0">Kamera ve mikrofonu inceleyin</text>
    </g>
    <g>
      <circle cx="596" cy="426" r="17" fill="#22d3ee"/>
      <text x="596" y="433" text-anchor="middle" font-size="17" font-weight="800" fill="#0b1220">✓</text>
      <text x="630" y="433" fill="#e2e8f0">Birikmiş tanılama verisini silin</text>
    </g>
    <g>
      <circle cx="596" cy="470" r="15" fill="#4ade80"/>
      <path d="M590 470 l4 4 l8 -9" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="477" fill="#e2e8f0">Edge gizlilik ayarlarını gözden geçirin</text>
    </g>
  </g>

  <g fill="#fbbf24" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="490" cy="500" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
