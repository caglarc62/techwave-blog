<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">M6 MacBook Pro ve iMac karşılaştırması</title><desc id="desc">Taşınabilir dizüstü ile ekranı ve aksesuarları dahil hepsi bir arada masaüstü bilgisayarın kullanım farkları</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1e35"/><stop offset="1" stop-color="#202b58"/></linearGradient></defs><rect width="1200" height="500" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-family="Arial" font-size="32" font-weight="700">İki M6 Mac, iki farklı çalışma biçimi</text><g font-family="Arial" fill="#eaf0ff"><rect x="55" y="112" width="520" height="315" rx="20" fill="#152a48" stroke="#4bd9c5" stroke-width="2"/><rect x="625" y="112" width="520" height="315" rx="20" fill="#152a48" stroke="#8d8bff" stroke-width="2"/><text x="85" y="158" fill="#70ebd7" font-size="25" font-weight="700">14″ MacBook Pro</text><text x="655" y="158" fill="#b8b7ff" font-size="25" font-weight="700">24″ iMac</text><text x="88" y="208" font-size="20">• Çantaya al, farklı yerde çalış</text><text x="88" y="253" font-size="20">• XDR ekran ve 24 saate kadar pil</text><text x="88" y="298" font-size="20">• HDMI, MagSafe, SDXC ve 3× TB4</text><text x="88" y="343" font-size="20">• Başlangıç: 137.999 TL</text><text x="658" y="208" font-size="20">• 24″ 4.5K ekran tek gövdede</text><text x="658" y="253" font-size="20">• 7 renk, masaüstünde sade kurulum</text><text x="658" y="298" font-size="20">• 2× veya 4× Thunderbolt 4 seçeneği</text><text x="658" y="343" font-size="20">• Başlangıç: 104.999 TL</text><text x="600" y="467" text-anchor="middle" fill="#9fb3d5" font-size="16">Fiyatlar Apple Türkiye’nin duyurduğu başlangıç fiyatlarıdır; yapılandırmaya göre değişir.</text></g></svg>