<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#fbbf24" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA)"/>
  <rect width="1200" height="600" fill="url(#glowA)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#fbbf24"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fcd34d" letter-spacing="3">BLOCKCHAIN · WEB3</text>
  <text x="104" y="310" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Cüzdan Güvenliği Rehberi</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Varlıklarınızı Korumanın Yolu</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Seed offline · büyük tutar soğukta · her imza okunarak</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="620" y="130" width="510" height="330" rx="18" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
    <text x="652" y="176" font-size="20" font-weight="700" fill="#64748b" letter-spacing="3">ANAHTAR HİYERARŞİSİ</text>

    <rect x="652" y="200" width="446" height="72" rx="12" fill="#132033" stroke="#fbbf24" stroke-width="2"/>
    <text x="676" y="232" font-size="22" font-weight="800" fill="#fcd34d">Seed Phrase (12/24 kelime)</text>
    <text x="676" y="260" font-size="16" fill="#94a3b8">en üst yetki · çevrimdışı · asla paylaşılmaz</text>

    <rect x="652" y="288" width="446" height="72" rx="12" fill="#132033" stroke="#f59e0b" stroke-width="2"/>
    <text x="676" y="320" font-size="22" font-weight="800" fill="#fbbf24">Private Key</text>
    <text x="676" y="348" font-size="16" fill="#94a3b8">imzalama yetkisi · kimdeyse varlık onda</text>

    <rect x="652" y="376" width="446" height="62" rx="12" fill="#132033" stroke="#4ade80" stroke-width="2"/>
    <text x="676" y="406" font-size="21" font-weight="800" fill="#86efac">Public Key / Adres</text>
    <text x="676" y="430" font-size="16" fill="#94a3b8">güvenli · paylaşılır · alıcı kimliği</text>
  </g>

  <g fill="#fbbf24" opacity="0.85"><circle cx="150" cy="130" r="4"/><circle cx="540" cy="500" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
