<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) rotate(90) scale(320)">
      <stop stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Güvenli Otomasyon Kontrol Listesi</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Yapmayın / Yapın — toplu işlemde tek hata her şeyi götürür</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="212" font-size="22" font-weight="800" fill="#fca5a5" letter-spacing="2">YAPMAYIN</text>
    <text x="640" y="212" font-size="22" font-weight="800" fill="#86efac" letter-spacing="2">YAPIN</text>

    <g font-size="18">
      <rect x="70" y="230" width="510" height="66" rx="12" fill="#0c1526" stroke="#f87171" stroke-width="1.5"/>
