      <rect x="70" y="310" width="510" height="66" rx="12" fill="#0c1526" stroke="#f87171" stroke-width="1.5"/>
      <text x="96" y="350" fill="#e2e8f0">Doğrudan rmtree / kalıcı silme</text>
      <rect x="640" y="310" width="510" height="66" rx="12" fill="#0c1526" stroke="#4ade80" stroke-width="1.5"/>
