<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 470) rotate(90) scale(280)">
      <stop stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Üç Kategori, Üç Farklı İş</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Önce hedefi yazın, sonra aracı seçin</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="340" height="300" rx="16" fill="#0c1526" stroke="#ec4899" stroke-width="2"/>
      <text x="98" y="248" font-size="24" font-weight="800" fill="#f9a8d4">Metinden Videoya</text>
      <text x="98" y="288" font-size="17" fill="#e2e8f0">5 – 15 saniyelik klip</text>
      <g font-size="16" fill="#94a3b8">
        <text x="98" y="326">· sosyal medya videosu</text>
        <text x="98" y="354">· arka plan / b-roll</text>
        <text x="98" y="382">· ürün tanıtım klibi</text>
      </g>
      <text x="98" y="430" font-size="16" font-weight="700" fill="#64748b">limit: kredi / tur hakkı</text>
      <text x="98" y="460" font-size="16" fill="#f9a8d4">örn: Kling, Pika, Luma</text>
    </g>
    <g>
      <rect x="430" y="200" width="340" height="300" rx="16" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="458" y="248" font-size="24" font-weight="800" fill="#c4b5fd">Görselden Videoya</text>
      <text x="458" y="288" font-size="17" fill="#e2e8f0">tek kareden hareket</text>
      <g font-size="16" fill="#94a3b8">
        <text x="458" y="326">· karakter tutarlılığı</text>
        <text x="458" y="354">· ürün animasyonu</text>
        <text x="458" y="382">· referans + hareket</text>
      </g>
      <text x="458" y="430" font-size="16" font-weight="700" fill="#64748b">limit: referans girdi</text>
      <text x="458" y="460" font-size="16" fill="#c4b5fd">avantaj: tutarlı kadraj</text>
    </g>
    <g>
      <rect x="790" y="200" width="340" height="300" rx="16" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="818" y="248" font-size="24" font-weight="800" fill="#67e8f9">Ses ve Müzik</text>
      <text x="818" y="288" font-size="17" fill="#e2e8f0">anlatım · efekt · beste</text>
      <g font-size="16" fill="#94a3b8">
        <text x="818" y="326">· seslendirme (voiceover)</text>
        <text x="818" y="354">· enstrümantal arka plan</text>
        <text x="818" y="382">· kurgu efektleri</text>
      </g>
      <text x="818" y="430" font-size="16" font-weight="700" fill="#64748b">limit: dakika / üretim</text>
      <text x="818" y="460" font-size="16" fill="#67e8f9">örn: ElevenLabs, Suno</text>
    </g>

    <rect x="70" y="524" width="1060" height="52" rx="12" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
    <text x="98" y="557" font-size="20" font-weight="700" fill="#e2e8f9">İlk ay için yeterli set: 1 video aracı + 1 ses aracı + 1 kurgu programı</text>
  </g>

  <g fill="#22d3ee" opacity="0.8"><circle cx="1155" cy="140" r="3"/><circle cx="420" cy="176" r="3"/></g>
</svg>
