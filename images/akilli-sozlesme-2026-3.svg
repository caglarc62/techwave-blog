<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 340) rotate(90) scale(320)">
      <stop stop-color="#f87171" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">6 Temel Risk ve Karşı Önlemi</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">En pahalısı ilk satır: denetlenmemiş kod</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="510" height="110" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="98" y="242" font-size="21" font-weight="800" fill="#fca5a5">Kod açığı</text>
      <text x="98" y="274" font-size="17" fill="#94a3b8">fon saldırgana akabilir</text>
      <text x="98" y="300" font-size="17" font-weight="700" fill="#e2e8f0">önlem: denetim + test + hazır kütüphane</text>
    </g>
    <g>
      <rect x="70" y="326" width="510" height="110" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="98" y="368" font-size="21" font-weight="800" fill="#fbbf24">Değiştirilemezlik</text>
      <text x="98" y="400" font-size="17" fill="#94a3b8">hata yayında kalır</text>
      <text x="98" y="426" font-size="17" font-weight="700" fill="#e2e8f0">önlem: baştan upgradeable tasarım</text>
    </g>
    <g>
      <rect x="70" y="452" width="510" height="110" rx="14" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="98" y="494" font-size="21" font-weight="800" fill="#c4b5fd">Oracle manipülasyonu</text>
      <text x="98" y="526" font-size="17" fill="#94a3b8">yanlış veriyle tetiklenme</text>
      <text x="98" y="552" font-size="17" font-weight="700" fill="#e2e8f0">önlem: çoklu bağımsız kaynak</text>
    </g>

    <g>
      <rect x="620" y="200" width="510" height="110" rx="14" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="648" y="242" font-size="21" font-weight="800" fill="#67e8f9">Gas / tıkanma</text>
      <text x="648" y="274" font-size="17" fill="#94a3b8">ücret fırlar, işlem sıkışır</text>
      <text x="648" y="300" font-size="17" font-weight="700" fill="#e2e8f0">önlem: tıkanıklıkta beklemek</text>
    </g>
    <g>
      <rect x="620" y="326" width="510" height="110" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="648" y="368" font-size="21" font-weight="800" fill="#86efac">Anahtar kaybı</text>
      <text x="648" y="400" font-size="17" fill="#94a3b8">sahiplik ele geçirilir</text>
      <text x="648" y="426" font-size="17" font-weight="700" fill="#e2e8f0">önlem: multisig + kasaya bağlama</text>
    </g>
    <g>
      <rect x="620" y="452" width="510" height="110" rx="14" fill="#0c1526" stroke="#94a3b8" stroke-width="2"/>
      <text x="648" y="494" font-size="21" font-weight="800" fill="#cbd5e1">Yasal boşluk</text>
      <text x="648" y="526" font-size="17" fill="#94a3b8">anlaşmazlıkta muhatap belirsiz</text>
      <text x="648" y="552" font-size="17" font-weight="700" fill="#e2e8f0">önlem: metin + şeffaf kod birlikte</text>
    </g>
  </g>
</svg>
