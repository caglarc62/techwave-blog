<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1e38"/>
      <stop offset="1" stop-color="#132c52"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 300) rotate(90) scale(280)">
      <stop stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel2" x1="560" y1="150" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132033"/>
      <stop offset="1" stop-color="#0c1526"/>
    </linearGradient>
    <linearGradient id="bar2" x1="600" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>
  <rect width="1200" height="600" fill="url(#glow2)"/>

  <!-- sol metin -->
  <rect x="70" y="208" width="8" height="150" rx="4" fill="#38bdf8"/>
  <text x="104" y="250" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#7dd3fc" letter-spacing="3">MICROSOFT</text>
  <text x="104" y="312" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Patch Salı</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#94a3b8">94 bildirim · 12 kritik</text>

  <!-- Windows güncelleme paneli -->
  <rect x="560" y="150" width="560" height="300" rx="20" fill="url(#panel2)" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="560" y="150" width="560" height="52" rx="20" fill="#0a1120"/>
  <circle cx="592" cy="176" r="7" fill="#ef4444"/>
  <circle cx="616" cy="176" r="7" fill="#f59e0b"/>
  <circle cx="640" cy="176" r="7" fill="#22c55e"/>
  <text x="672" y="184" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">Windows Update</text>

  <text x="600" y="252" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">Güncellemeler denetleniyor…</text>
  <rect x="600" y="284" width="480" height="16" rx="8" fill="#1e293b"/>
  <rect x="600" y="284" width="376" height="16" rx="8" fill="url(#bar2)"/>
  <text x="600" y="336" font-family="Inter, Arial, sans-serif" font-size="22" fill="#64748b">KB503 · kritik yamalar uygulanıyor</text>

  <!-- kalem/onay satırları -->
  <g font-family="Inter, Arial, sans-serif" font-size="22">
    <circle cx="612" cy="380" r="11" fill="#22c55e"/><path d="M606 380 l4 4 l8 -8" stroke="#0b1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="640" y="388" fill="#cbd5e1">Windows Kernel yaması</text>
    <circle cx="612" cy="418" r="11" fill="#22c55e"/><path d="M606 418 l4 4 l8 -8" stroke="#0b1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="640" y="426" fill="#cbd5e1">Active Directory FSS</text>
  </g>

  <g fill="#38bdf8" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="480" cy="470" r="4"/><circle cx="1150" cy="110" r="3"/></g>
</svg>
