<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Bilinenler ve açıklanmayan ayrıntılar</title><desc id="d">Programda doğrulanan bilgiler ve kamuya açıklanmayan koşullar</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#101d42"/><stop offset="1" stop-color="#142c4b"/></linearGradient></defs><rect width="1200" height="500" rx="28" fill="url(#b)"/><text x="56" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Başlıkta sayı var; ayrıntılar sınırlı</text><g transform="translate(56 112)" font-family="Inter,Arial,sans-serif"><rect width="518" height="294" rx="24" fill="#123e4a" stroke="#39d6c2" stroke-width="2"/><text x="32" y="52" fill="#7bf0dc" font-size="24" font-weight="800">DOĞRULANANLAR</text><g fill="#ecfffb" font-size="21"><text x="36" y="104">✓  Gönüllü ve süreli program</text><text x="36" y="150">✓  Dört ülkede, katılımcı ekiplerde</text><text x="36" y="196">✓  Finansal ve kariyer desteği var</text><text x="36" y="242">✓  Yaklaşık 60 bin kişi potansiyel havuz</text></g><rect x="570" width="518" height="294" rx="24" fill="#342844" stroke="#ad82ff" stroke-width="2"/><text x="602" y="52" fill="#d2baff" font-size="24" font-weight="800">HENÜZ AÇIKLANMAYANLAR</text><g fill="#f9f3ff" font-size="21"><text x="606" y="104">?  Tek tip ödeme formülü</text><text x="606" y="150">?  Toplam başvuru / ayrılma sayısı</text><text x="606" y="196">?  Kamuya açık kabul son tarihi</text><text x="606" y="242">?  Ürün ve ekip bazlı olası etkiler</text></g></g><text x="56" y="459" fill="#a9c1df" font-family="Inter,Arial,sans-serif" font-size="17">60.000 uygun kişi ≠ 60.000 işten çıkarma veya kesin ayrılış</text></svg>
