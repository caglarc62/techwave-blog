<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) rotate(90) scale(320)">
      <stop stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">İyi Video Prompt'unun 5 Elemanı</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Video modeli sahneyi kare kare düşünür — bir sahnede tek olay</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="210" height="160" rx="14" fill="#0c1526" stroke="#ec4899" stroke-width="2"/>
      <text x="98" y="246" font-size="20" font-weight="800" fill="#f9a8d4">1 · Konu</text>
      <text x="98" y="284" font-size="16" fill="#e2e8f0">ne görünüyor?</text>
      <text x="98" y="312" font-size="15" fill="#94a3b8">"mor ceketli barista,</text>
      <text x="98" y="334" font-size="15" fill="#94a3b8">ahşap tezgâhta"</text>
    </g>
    <g>
      <rect x="300" y="200" width="210" height="160" rx="14" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="328" y="246" font-size="20" font-weight="800" fill="#c4b5fd">2 · Kamera</text>
      <text x="328" y="284" font-size="16" fill="#e2e8f0">nasıl bakılıyor?</text>
      <text x="328" y="312" font-size="15" fill="#94a3b8">geniş açı, sabit</text>
      <text x="328" y="334" font-size="15" fill="#94a3b8">/ yavaş kaydırma</text>
    </g>
    <g>
      <rect x="530" y="200" width="210" height="160" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="558" y="246" font-size="20" font-weight="800" fill="#fbbf24">3 · Hareket</text>
      <text x="558" y="284" font-size="16" fill="#e2e8f0">ne değişiyor?</text>
      <text x="558" y="312" font-size="15" fill="#94a3b8">buhar yükselir,</text>
      <text x="558" y="334" font-size="15" fill="#94a3b8">ışık kayar</text>
    </g>
    <g>
      <rect x="760" y="200" width="210" height="160" rx="14" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="788" y="246" font-size="20" font-weight="800" fill="#67e8f9">4 · Işık</text>
      <text x="788" y="284" font-size="16" fill="#e2e8f0">ton nedir?</text>
      <text x="788" y="312" font-size="15" fill="#94a3b8">sıcak sabah ışığı,</text>
      <text x="788" y="334" font-size="15" fill="#94a3b8">sinematik kontrast</text>
    </g>
    <g>
      <rect x="990" y="200" width="140" height="160" rx="14" fill="#132033" stroke="#4ade80" stroke-width="2"/>
      <text x="1014" y="246" font-size="20" font-weight="800" fill="#86efac">5 · Süre</text>
      <text x="1014" y="284" font-size="16" fill="#e2e8f0">format</text>
      <text x="1014" y="312" font-size="15" fill="#94a3b8">5 sn</text>
      <text x="1014" y="334" font-size="15" fill="#94a3b8">9:16</text>
    </g>

    <rect x="70" y="396" width="1060" height="76" rx="14" fill="#132033" stroke="#ec4899" stroke-width="2"/>
    <text x="100" y="430" font-size="21" font-weight="800" fill="#f9a8d4">Kural: bir sahnede tek olay</text>
    <text x="100" y="458" font-size="18" fill="#e2e8f9">Üç olay varsa üç klip üretin, kurguda birleştirin — model sahneyi dağıtır</text>

    <rect x="70" y="492" width="1060" height="76" rx="14" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
    <text x="100" y="526" font-size="20" font-weight="700" fill="#67e8f9">Tutarlılık ipucu</text>
    <text x="100" y="554" font-size="18" fill="#94a3b8">Aynı prompt çekirdeği + referans görsel → ikinci klip de aynı karakteri korur</text>
  </g>

  <g fill="#f59e0b" opacity="0.8"><circle cx="1160" cy="140" r="3"/><circle cx="600" cy="176" r="3"/></g>
</svg>
