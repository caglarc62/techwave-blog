<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Teklif kapsamı</title><desc id="d">Dört ülke, seçili ekipler ve seviye 70 ve altı şartı</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101d42"/><stop offset="1" stop-color="#17405f"/></linearGradient></defs><rect width="1200" height="500" rx="28" fill="url(#b)"/><text x="56" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Teklif kimlere açık?</text><text x="56" y="112" fill="#a9c1df" font-family="Inter,Arial,sans-serif" font-size="18">Microsoft'un 26 Ekim tarihli duyurusuna göre</text><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g transform="translate(64 155)"><rect width="250" height="205" rx="24" fill="#172e55" stroke="#5e78c6"/><circle cx="125" cy="70" r="34" fill="#243f70"/><path d="M91 70h68M125 36v68" stroke="#55dbc8" stroke-width="7"/><text x="125" y="142" fill="#fff" font-size="21" font-weight="700">4 ülke</text><text x="125" y="174" fill="#a9c1df" font-size="17">ABD · Kanada · Birleşik Krallık</text><text x="125" y="197" fill="#a9c1df" font-size="17">· Hindistan</text></g><g transform="translate(348 155)"><rect width="250" height="205" rx="24" fill="#172e55" stroke="#5e78c6"/><circle cx="125" cy="70" r="34" fill="#243f70"/><path d="M106 78l13 13 27-34" fill="none" stroke="#55dbc8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="142" fill="#fff" font-size="21" font-weight="700">Seçili ekipler</text><text x="125" y="174" fill="#a9c1df" font-size="17">Her organizasyon</text><text x="125" y="197" fill="#a9c1df" font-size="17">programa katılmıyor</text></g><g transform="translate(632 155)"><rect width="250" height="205" rx="24" fill="#172e55" stroke="#5e78c6"/><circle cx="125" cy="70" r="34" fill="#243f70"/><text x="125" y="80" fill="#55dbc8" font-size="29" font-weight="800">70↓</text><text x="125" y="142" fill="#fff" font-size="21" font-weight="700">İç seviye</text><text x="125" y="174" fill="#a9c1df" font-size="17">70 ve altı</text><text x="125" y="197" fill="#a9c1df" font-size="17">çalışanlar</text></g><g transform="translate(916 155)"><rect width="220" height="205" rx="24" fill="#173c4d" stroke="#40c8bb"/><circle cx="110" cy="70" r="34" fill="#1e5865"/><path d="M110 48v26m0 13v2" stroke="#66e6cf" stroke-width="7" stroke-linecap="round"/><text x="110" y="142" fill="#fff" font-size="21" font-weight="700">Gönüllü</text><text x="110" y="174" fill="#a9c1df" font-size="17">Teklif almak</text><text x="110" y="197" fill="#a9c1df" font-size="17">ayrılmak zorunlu değil</text></g></g><text x="56" y="435" fill="#69dfd1" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Not: 70. seviye koşulu tek başına yeterli değil; ekip de programa katılmalı.</text></svg>
