      <text x="570" y="464" font-size="21" fill="#94a3b8">Büyük ölçek · binlerce sayfa</text>
      <rect x="980" y="408" width="112" height="36" rx="18" fill="#0b1220" stroke="#4ade80" stroke-width="2"/>
      <text x="1036" y="433" text-anchor="middle" font-size="17" font-weight="700" fill="#4ade80">İleri</text>
    </g>
  </g>

  <g fill="#a78bfa" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="500" r="4"/><circle cx="1160" cy="130" r="3"/></g>
