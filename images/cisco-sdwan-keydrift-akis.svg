<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">KeyDrift saldırı akışı</title><desc id="d">Kimlik doğrulama açığından kalıcı erişim ve anahtar materyali toplamaya uzanan şematik akış</desc><defs><linearGradient id="g"><stop stop-color="#5be2d0"/><stop offset="1" stop-color="#8a73ff"/></linearGradient></defs><rect width="1200" height="440" rx="28" fill="#0b1c30"/><text x="50" y="62" fill="#9cf5e7" font-family="Arial" font-size="20" font-weight="700" letter-spacing="3">SALDIRI ZİNCİRİ · TALOS BULGULARININ ÖZETİ</text><g font-family="Arial" text-anchor="middle"><g><rect x="45" y="130" width="235" height="190" rx="20" fill="#142b48" stroke="#52678a" stroke-width="2"/><circle cx="162" cy="185" r="28" fill="#392a58"/><text x="162" y="194" fill="#ffce70" font-size="25" font-weight="700">01</text><text x="162" y="245" fill="white" font-size="20" font-weight="700">Kimlik doğrulama</text><text x="162" y="275" fill="#b8c8dc" font-size="17">açığından erişim</text><text x="162" y="300" fill="#83e8db" font-size="15">CVE-2026-20127</text></g><path d="M292 225h45" stroke="url(#g)" stroke-width="6"/><path d="m328 215 15 10-15 10" fill="none" stroke="#8a73ff" stroke-width="5"/><g><rect x="350" y="130" width="235" height="190" rx="20" fill="#142b48" stroke="#52678a" stroke-width="2"/><circle cx="467" cy="185" r="28" fill="#392a58"/><text x="467" y="194" fill="#ffce70" font-size="25" font-weight="700">02</text><text x="467" y="245" fill="white" font-size="20" font-weight="700">Kontrolöre</text><text x="467" y="275" fill="#b8c8dc" font-size="17">kalıcılık yerleştirme</text><text x="467" y="300" fill="#83e8db" font-size="15">PolyFlame / KeyDrift</text></g><path d="M597 225h45" stroke="url(#g)" stroke-width="6"/><path d="m633 215 15 10-15 10" fill="none" stroke="#8a73ff" stroke-width="5"/><g><rect x="655" y="130" width="235" height="190" rx="20" fill="#142b48" stroke="#52678a" stroke-width="2"/><circle cx="772" cy="185" r="28" fill="#392a58"/><text x="772" y="194" fill="#ffce70" font-size="25" font-weight="700">03</text><text x="772" y="245" fill="white" font-size="20" font-weight="700">Trafik ve anahtar</text><text x="772" y="275" fill="#b8c8dc" font-size="17">materyalini inceleme</text><text x="772" y="300" fill="#83e8db" font-size="15">Talos değerlendirmesi</text></g><path d="M902 225h45" stroke="url(#g)" stroke-width="6"/><path d="m938 215 15 10-15 10" fill="none" stroke="#8a73ff" stroke-width="5"/><g><rect x="960" y="130" width="195" height="190" rx="20" fill="#142b48" stroke="#52678a" stroke-width="2"/><circle cx="1057" cy="185" r="28" fill="#392a58"/><text x="1057" y="194" fill="#ffce70" font-size="25" font-weight="700">04</text><text x="1057" y="245" fill="white" font-size="20" font-weight="700">Şifreli aktarım</text><text x="1057" y="275" fill="#b8c8dc" font-size="17">veya aşamalama</text><text x="1057" y="300" fill="#83e8db" font-size="15">her vakada kanıtlanmış değil</text></g></g><text x="50" y="390" fill="#aabbd2" font-family="Arial" font-size="17">Şema, Talos'un analizini sadeleştirir; bütün adımların her hedefte aynı biçimde gerçekleştiği anlamına gelmez.</text></svg>
