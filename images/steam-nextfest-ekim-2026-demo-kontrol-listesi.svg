<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Steam Next Fest demosu için dört adımlı kontrol listesi</title>
  <desc id="desc">Bir demoyu indirmeden önce tür, teknik gereksinimler, oynama süresi ve geliştirici duyurularını kontrol edin.</desc>
  <rect width="1200" height="520" rx="28" fill="#f1f5fb"/><text x="52" y="66" fill="#152540" font-family="Arial,sans-serif" font-size="25" font-weight="800">SON SAATLERDE DEMO SEÇME KONTROL LİSTESİ</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(50 118)"><rect width="530" height="145" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><circle cx="68" cy="70" r="35" fill="#dff9f5"/><text x="68" y="81" text-anchor="middle" fill="#167e7a" font-size="30" font-weight="800">1</text><text x="125" y="57" fill="#1a2c49" font-size="23" font-weight="800">Önce ilgini çeken tür</text><text x="125" y="94" fill="#596982" font-size="18">Kategoriyi veya etiketi seç; rastgele gezme.</text></g>
    <g transform="translate(620 118)"><rect width="530" height="145" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><circle cx="68" cy="70" r="35" fill="#ece9ff"/><text x="68" y="81" text-anchor="middle" fill="#6452bd" font-size="30" font-weight="800">2</text><text x="125" y="57" fill="#1a2c49" font-size="23" font-weight="800">Donanım ve dil bilgisi</text><text x="125" y="94" fill="#596982" font-size="18">Mağaza sayfasında işletim sistemi ve dili kontrol et.</text></g>
    <g transform="translate(50 300)"><rect width="530" height="145" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><circle cx="68" cy="70" r="35" fill="#fff2dc"/><text x="68" y="81" text-anchor="middle" fill="#bd7c1e" font-size="30" font-weight="800">3</text><text x="125" y="57" fill="#1a2c49" font-size="23" font-weight="800">Küçük bir oynama hedefi</text><text x="125" y="94" fill="#596982" font-size="18">Önce 15–30 dakika dene; yükleme boyutunu unutma.</text></g>
    <g transform="translate(620 300)"><rect width="530" height="145" rx="22" fill="#fff" stroke="#d9e2ef" stroke-width="2"/><circle cx="68" cy="70" r="35" fill="#e0eefc"/><text x="68" y="81" text-anchor="middle" fill="#3275b5" font-size="30" font-weight="800">4</text><text x="125" y="57" fill="#1a2c49" font-size="23" font-weight="800">Duyuruyu ve istek listesini kontrol et</text><text x="125" y="94" fill="#596982" font-size="18">Demo süresi ve tam oyun çıkışı geliştiriciye bağlıdır.</text></g>
  </g>
</svg>
