<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">M6 MacBook Pro ve iMac</title><desc id="desc">Yeni Apple dizüstü ve masaüstü bilgisayarlarının karşılaştırmalı TechWave çizimi</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#18204c"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#34d6c3"/><stop offset=".5" stop-color="#536cff"/><stop offset="1" stop-color="#c15cff"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f5f7fb"/><stop offset="1" stop-color="#a9b5c5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="24"/></filter></defs><rect width="1200" height="600" rx="34" fill="url(#bg)"/><circle cx="800" cy="270" r="180" fill="#5a6cff" opacity=".18" filter="url(#glow)"/><circle cx="250" cy="150" r="110" fill="#25d8c3" opacity=".12" filter="url(#glow)"/><text x="70" y="92" fill="#80f2df" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">TECHWAVE  /  DONANIM</text><text x="70" y="151" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="800">Apple’ın yeni M6 Mac ailesi</text><text x="72" y="190" fill="#b9c7df" font-family="Arial,sans-serif" font-size="21">Taşınabilir güç mü, masada hepsi bir arada mı?</text><g transform="translate(105 250)"><rect x="0" y="0" width="420" height="235" rx="15" fill="#c9d2dd"/><rect x="10" y="10" width="400" height="207" rx="8" fill="url(#screen)"/><circle cx="210" cy="113" r="65" fill="#13254e" opacity=".35"/><text x="210" y="128" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="800" font-size="42">M6</text><path d="M-30 240h480l-38 28H8z" fill="url(#metal)"/><path d="M140 241h140l-10 7h-120z" fill="#8996a7"/></g><g transform="translate(650 218)"><rect x="0" y="0" width="425" height="270" rx="19" fill="url(#metal)"/><rect x="13" y="13