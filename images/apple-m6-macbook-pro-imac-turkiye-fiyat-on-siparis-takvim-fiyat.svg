<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Apple M6 bilgisayarlarının Türkiye takvimi</title><desc id="desc">Ön sipariş 28 Ekim'de başlıyor, satışlar 6 Kasım'da başlıyor. Başlangıç fiyatları MacBook Pro için 137.999, iMac için 104.999 TL.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#10243f"/><stop offset="1" stop-color="#302b61"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-family="Arial" font-size="31" font-weight="700">Türkiye takvimi ve başlangıç fiyatları</text><path d="M155 190H1040" stroke="#6579ab" stroke-width="5"/><circle cx="240" cy="190" r="17" fill="#60e3cf"/><circle cx="920" cy="190" r="17" fill="#aaa1ff"/><g font-family="Arial"><text x="240" y="145" text-anchor="middle" fill="#82f1df" font-size="23" font-weight="700">28 EKİM</text><text x="240" y="235" text-anchor="middle" fill="#fff" font-size="20">Ön sipariş başlıyor</text><text x="920" y="145" text-anchor="middle" fill="#c0baff" font-size="23" font-weight="700">6 KASIM</text><text x="920" y="235" text-anchor="middle" fill="#fff" font-size="20">Satış ve teslimat başlıyor</text><rect x="130" y="295" width="440" height="78" rx="16" fill="#173654"/><rect x="630" y="295" width="440" height="78" rx="16" fill="#292854"/><text x="350" y="326" text-anchor="middle" fill="#dceaff" font-size="17">14″ MacBook Pro M6</text><text x="350" y="356" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">137.999 TL’den</text><text x="850" y="326" text-anchor="middle" fill="#e1e0ff" font-size="17">24″ iMac M6</text><text x="850" y="356" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">104.999 TL’den</text></g></svg>