<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#123043"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#34d399"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6ee7b7" letter-spacing="3">İZİNLER</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Kamera, Mikrofon</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#e2e8f0">ve Konum</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Uygulama bazında denetleyin</text>

  <rect x="600" y="140" width="480" height="320" rx="20" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
  <text x="632" y="186" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b" letter-spacing="3">UYGULAMA İZİNLERİ</text>

  <g font-family="Inter, Arial, sans-serif" font-size="21">
    <g>
      <rect x="632" y="210" width="416" height="66" rx="12" fill="#132033"/>
      <circle cx="672" cy="243" r="18" fill="#1e293b"/>
      <path d="M664 243 h16 M672 235 v16" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <text x="706" y="238" fill="#e2e8f0">Kamera</text>
      <text x="706" y="264" font-size="18" fill="#64748b">Yalnızca gerekli uygulamalar</text>
      <text x="1024" y="251" text-anchor="end" font-size="20" font-weight="700" fill="#4ade80">✓</text>
    </g>
    <g>
      <rect x="632" y="286" width="416" height="66" rx="12" fill="#132033"/>
      <circle cx="672" cy="319" r="18" fill="#1e293b"/>
      <path d="M664 319 h16 M672 311 v16" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <text x="706" y="314" fill="#e2e8f0">Mikrofon</text>
      <text x="706" y="340" font-size="18" fill="#64748b">Gereksiz olanları kapatın</text>
      <text x="1024" y="327" text-anchor="end" font-size="20" font-weight="700" fill="#fbbf24">!</text>
    </g>
    <g>
      <rect x="632" y="362" width="416" height="66" rx="12" fill="#132033"/>
      <circle cx="672" cy="395" r="18" fill="#1e293b"/>
      <path d="M664 395 h16 M672 387 v16" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
      <text x="706" y="390" fill="#e2e8f0">Konum</text>
      <text x="706" y="416" font-size="18" fill="#64748b">Arka planda erişimi durdurun</text>
      <text x="1024" y="403" text-anchor="end" font-size="20" font-weight="700" fill="#f87171">✕</text>
    </g>
  </g>

  <text x="632" y="490" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Ayarlar → Gizlilik ve güvenlik → Kamera</text>

  <g fill="#34d399" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="500" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
