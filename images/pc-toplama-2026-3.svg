<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(330)">
      <stop stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Montaj Sırası: 8 Adım</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Önce kasasız test, sonra kasaya alma</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="190" width="510" height="56" rx="10" fill="#132033" stroke="#4ade80" stroke-width="1.5"/>
      <text x="94" y="225" font-size="18" fill="#e2e8f0"><tspan font-weight="800" fill="#86efac">1-2 </tspan> Dış kurulum · CPU'yu zorlamadan yerleştir</text>
      <rect x="70" y="256" width="510" height="56" rx="10" fill="#132033" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="94" y="291" font-size="18" fill="#e2e8f0"><tspan font-weight="800" fill="#67e8f9">3-4 </tspan> RAM çift kanal · M.2 SSD vidala</text>
      <rect x="70" y="322" width="510" height="56" rx="10" fill="#132033" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="94" y="357" font-size="18" fill="#e2e8f0"><tspan font-weight="800" fill="#fbbf24">5-6 </tspan> Soğutucu + macun · kasaya al, vidala</text>
      <rect x="70" y="388" width="510" height="56" rx="10" fill="#132033" stroke="#a855f7" stroke-width="1.5"/>
      <text x="94" y="423" font-size="18" fill="#e2e8f0"><tspan font-weight="800" fill="#c4b5fd">7 </tspan> Kablolar: 24-pin · 8-pin CPU · GPU 6+2</text>
      <rect x="70" y="454" width="510" height="56" rx="10" fill="#132033" stroke="#4ade80" stroke-width="1.5"/>
      <text x="94" y="489" font-size="18" fill="#e2e8f0"><tspan font-weight="800" fill="#86efac">8 </tspan> İlk ateş: fan döndü, ekran geldi → BIOS</text>
    </g>

    <g>
      <rect x="620" y="190" width="510" height="320" rx="16" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
      <text x="650" y="234" font-size="22" font-weight="800" fill="#e2e8f9">İlk Gün Testleri</text>
      <g font-size="18" fill="#e2e8f0">
        <text x="650" y="278"><tspan font-weight="800" fill="#67e8f9">1 </tspan> Windows 11 kur (resmî medya)</text>
        <text x="650" y="322"><tspan font-weight="800" fill="#86efac">2 </tspan> BIOS: XMP/EXPO profilini aç</text>
        <text x="650" y="366"><tspan font-weight="800" fill="#fbbf24">3 </tspan> Sürücü: anakart çipset + GPU</text>
        <text x="650" y="410"><tspan font-weight="800" fill="#c4b5fd">4 </tspan> Stres: 3DMark + MemTest86</text>
        <text x="650" y="454"><tspan font-weight="800" fill="#fca5a5">5 </tspan> Sıcaklık: GPU 85°C altı</text>
        <text x="650" y="498"><tspan font-weight="800" fill="#cbd5e1">6 </tspan> 15 dk gerçek oyun testi</text>
      </g>
    </g>

    <rect x="70" y="534" width="1060" height="44" rx="12" fill="#0f2b1e" stroke="#4ade80" stroke-width="2"/>
    <text x="98" y="563" font-size="19" font-weight="700" fill="#86efac">İpucu: ilk sistemi kasasız kur → sorunu kasa sökmeden gör</text>
  </g>
</svg>
