<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#101c36"/><text x="54" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Bir karar API'si uygulamada nereye oturur?</text><text x="56" y="105" fill="#a8b8d3" font-family="Arial,sans-serif" font-size="17">Model yanıtı üretir; iş akışını ve gerçek işlemi sizin uygulamanız yönetir.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="190" width="210" height="150" rx="20" fill="#1b2d52" stroke="#506998"/><text x="160" y="238" fill="#6df4dc" font-size="18" font-weight="700">1 · GİRDİ</text><text x="160" y="276" fill="#fff" font-size="18">Metin / görsel</text><text x="160" y="306" fill="#fff" font-size="18">/ JSON</text><rect x="350" y="190" width="230" height="150" rx="20" fill="#1c3b56" stroke="#42b6ad"/><text x="465" y="238" fill="#6df4dc" font-size="18" font-weight="700">2 · SORU</text><text x="465" y="276" fill="#fff" font-size="18">Tür + yönerge</text><text x="465" y="306" fill="#fff" font-size="18">+ izinli seçenekler</text><rect x="665" y="190" width="220" height="150" rx="20" fill="#283363" stroke="#8c8bf2"/><text x="775" y="238" fill="#c9c7ff" font-size="18" font-weight="700">3 · CEVAP</text><text x="775" y="276" fill="#fff" font-size="18">Seçim, puan</text><text x="775" y="306" fill="#fff" font-size="18">veya olasılık</text><rect x="970" y="190" width="180" height="150" rx="20" fill="#203e42" stroke="#65d6ad"/><text x="1060" y="238" fill="#6df4dc" font-size="18" font-weight="700">4 · UYGULAMA</text><text x="1060" y="276" fill="#fff" font-size="18">Eşik / insan</text><text x="1060" y="306" fill="#fff" font-size="18">/ sonraki adım</text></g><g stroke="#6df4dc" stroke-width="3" fill="none"><path d="M274 265h65m-9-8 9 8-9 8M589 265h65m-9-8 9 8-9 8M894 265h65m-9-8 9 8-9 8"/></g><text x="600" y="425" text-anchor="middle" fill="#9db0d0" font-family="Arial,sans-serif" font-size="18">Yüksek riskli veya belirsiz sonuçlar için insan incelemesi ekleyin.</text></svg>