<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) rotate(90) scale(320)">
      <stop stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">30 Günlük Pil Deneyi</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ölç → Sınır → Temizlik → Karşılaştır</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="210" width="250" height="240" rx="16" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="96" y="256" font-size="22" font-weight="800" fill="#67e8f9">1. HAFTA</text>
      <text x="96" y="292" font-size="19" font-weight="700" fill="#e2e8f0">Ölç</text>
      <g font-size="16" fill="#94a3b8">
        <text x="96" y="330">ekran süresini not et</text>
        <text x="96" y="358">akşam kalan yüzdesi</text>
        <text x="96" y="386">en çok yiyen 3 uygulama</text>
        <text x="96" y="414">hiçbir şeyi değiştirme</text>
      </g>
    </g>
    <g>
      <rect x="340" y="210" width="250" height="240" rx="16" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="366" y="256" font-size="22" font-weight="800" fill="#86efac">2. HAFTA</text>
      <text x="366" y="292" font-size="19" font-weight="700" fill="#e2e8f0">Sınır</text>
      <g font-size="16" fill="#94a3b8">
        <text x="366" y="330">%20 – %80 bandı</text>
        <text x="366" y="358">manuel parlaklık %70</text>
        <text x="366" y="386">optimize dolma açık</text>
        <text x="366" y="414">şarjda oyun yok</text>
      </g>
    </g>
    <g>
      <rect x="610" y="210" width="250" height="240" rx="16" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="636" y="256" font-size="22" font-weight="800" fill="#fbbf24">3. HAFTA</text>
      <text x="636" y="292" font-size="19" font-weight="700" fill="#e2e8f0">Temizlik</text>
      <g font-size="16" fill="#94a3b8">
        <text x="636" y="330">konum izinleri daralt</text>
        <text x="636" y="358">arka plan yenilemesi kapalı</text>
        <text x="636" y="386">gereksiz bildirimler sus</text>
        <text x="636" y="414">yazılımı güncelle</text>
      </g>
    </g>
    <g>
      <rect x="880" y="210" width="250" height="240" rx="16" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="906" y="256" font-size="22" font-weight="800" fill="#c4b5fd">4. HAFTA</text>
      <text x="906" y="292" font-size="19" font-weight="700" fill="#e2e8f0">Karşılaştır</text>
      <g font-size="16" fill="#94a3b8">
        <text x="906" y="330">1. haftayla kıyasla</text>
        <text x="906" y="358">hedef: %15–25 iyileşme</text>
        <text x="906" y="386">kalanı değil ekranı izle</text>
        <text x="906" y="414">iyi geleni rutine al</text>
      </g>
    </g>

    <rect x="70" y="490" width="1060" height="60" rx="14" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
    <text x="98" y="528" font-size="21" font-weight="700" fill="#e2e8f9">Karar verirken yüzdeye değil, ekran süresi grafiğine bakın — %80 altı ve pik performans uyarısı değişime işarettir</text>
  </g>
</svg>
