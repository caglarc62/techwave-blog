<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) rotate(90) scale(320)">
      <stop stop-color="#f87171" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">7 Yaygın Dolandırıcılık Şeması</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Hepsinin ortak noktası: sizi imzalamaya ikna etmek</text>

  <g font-family="Inter, Arial, sans-serif" font-size="17">
    <g>
      <rect x="70" y="196" width="510" height="94" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="98" y="234" font-size="21" font-weight="800" fill="#fca5a5">1 · Sahte site</text>
      <text x="98" y="266" fill="#94a3b8">metamaskk.io ≠ metamask.io — alan adını harf harf oku</text>
    </g>
    <g>
      <rect x="70" y="304" width="510" height="94" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="98" y="342" font-size="21" font-weight="800" fill="#fca5a5">2 · Sahte destek (DM)</text>
      <text x="98" y="374" fill="#94a3b8">"Yardımcı olayım" — resmî destek asla kelime istemez</text>
    </g>
    <g>
      <rect x="70" y="412" width="510" height="94" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="98" y="450" font-size="21" font-weight="800" fill="#fca5a5">3 · İmza phishing'i</text>
      <text x="98" y="482" fill="#94a3b8">"Onayla" sandığınız şey tüm bakiyeyi boşaltma yetkisi</text>
    </g>

    <g>
      <rect x="620" y="196" width="510" height="94" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="648" y="234" font-size="21" font-weight="800" fill="#fbbf24">4 · Airdrop / ödül tuzağı</text>
      <text x="648" y="266" fill="#94a3b8">"Cüzdanını bağla, ödülünü al" — bağlamak yetki vermektir</text>
    </g>
    <g>
      <rect x="620" y="304" width="510" height="94" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="648" y="342" font-size="21" font-weight="800" fill="#fbbf24">5 · Sahte güncelleme</text>
      <text x="648" y="374" fill="#94a3b8">yazılımı yalnızca resmî kanaldan güncelleyin</text>
    </g>
    <g>
      <rect x="620" y="412" width="510" height="94" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="648" y="450" font-size="21" font-weight="800" fill="#fbbf24">6 · Telefon + ses klonu</text>
      <text x="648" y="482" fill="#94a3b8">senin bildiğin numaradan ara — arayanı değil</text>
    </g>

    <rect x="70" y="524" width="1060" height="52" rx="12" fill="#132033" stroke="#f87171" stroke-width="2"/>
    <text x="98" y="557" font-size="20" font-weight="800" fill="#fca5a5">7 · Gerçek olamayacak getiri: %30 sabit aylık — yeni gelenin parasıyla ödeme</text>
  </g>
</svg>
