<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Phantom Blade Zero depolama alanı</title><desc id="desc">Oyun yaklaşık 145 gigabayt yer kaplıyor. Ön yükleme işlemi için 300 gigabayt boş alan ayırılması isteniyor.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#351d22"/></linearGradient><linearGradient id="bar"><stop stop-color="#f1634f"/><stop offset="1" stop-color="#ffbd7c"/></linearGradient></defs><rect width="1200" height="400" rx="28" fill="url(#bg)"/>
<text x="58" y="68" fill="#f2bb83" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">SSD ALANINI ÖNCEDEN KONTROL ET</text><text x="60" y="142" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="800">Kurulum: yaklaşık 145 GB</text><rect x="60" y="176" width="1080" height="36" rx="18" fill="#ffffff" fill-opacity=".11"/><rect x="60" y="176" width="522" height="36" rx="18" fill="url(#bar)"/><text x="60" y="260" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Ön yükleme sırasında: en az 300 GB boş alan</text><text x="60" y="310" fill="#b9bac4" font-family="Arial,sans-serif" font-size="20">300 GB, geçici ön yükleme süreci için açıklanan boş alan önerisidir.</text><text x="60" y="354" fill="#8f919e" font-family="Arial,sans-serif" font-size="17">Oyunun kurulu boyutu yaklaşık 145 GB olarak belirtiliyor; güncellemeler bu değeri değiştirebilir.</text>
</svg>
