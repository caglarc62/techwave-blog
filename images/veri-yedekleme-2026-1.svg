<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#4ade80" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA)"/>
  <rect width="1200" height="600" fill="url(#glowA)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#4ade80"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#86efac" letter-spacing="3">VERİ KORUMA</text>
  <text x="104" y="310" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Veri Yedekleme</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">3-2-1 Kuralı</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Yerel · Yedek · Bulut · Kurtarma testi</text>

  <!-- 3-2-1 diyagrami -->
  <rect x="600" y="130" width="480" height="340" rx="20" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
  <text x="632" y="176" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b" letter-spacing="3">YEDAKLEME KATMANLARI</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="632" y="196" width="416" height="70" rx="12" fill="#132033" stroke="#22d3ee" stroke-width="2"/>
      <text x="656" y="232" font-size="26" font-weight="800" fill="#67e8f9">3</text>
      <text x="700" y="230" font-size="21" fill="#e2e8f0">farklı kopya</text>
      <text x="700" y="256" font-size="18" fill="#64748b">asıl dosya + iki yedek</text>
    </g>
    <g>
      <rect x="632" y="278" width="416" height="70" rx="12" fill="#132033" stroke="#a855f7" stroke-width="2"/>
      <text x="656" y="314" font-size="26" font-weight="800" fill="#c4b5fd">2</text>
      <text x="700" y="312" font-size="21" fill="#e2e8f0">farklı ortam</text>
      <text x="700" y="338" font-size="18" fill="#64748b">disk + harici disk / NAS</text>
    </g>
    <g>
      <rect x="632" y="360" width="416" height="70" rx="12" fill="#132033" stroke="#4ade80" stroke-width="2"/>
      <text x="656" y="396" font-size="26" font-weight="800" fill="#86efac">1</text>
      <text x="700" y="394" font-size="21" fill="#e2e8f0">kopya uzakta / çevrimdışı</text>
      <text x="700" y="420" font-size="18" fill="#64748b">bulut veya bağlantısı kesilmiş disk</text>
    </g>
  </g>

  <g fill="#4ade80" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="520" cy="500" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
