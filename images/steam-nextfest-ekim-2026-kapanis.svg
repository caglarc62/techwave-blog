<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Steam Next Fest kapanış saati Türkiye'de 20.00</title>
  <desc id="desc">Valve'ın açıkladığı 10.00 Pasifik kapanış saati, 17.00 UTC ve 20.00 Türkiye saati karşılaştırması.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e2445"/><stop offset="1" stop-color="#172b54"/></linearGradient><linearGradient id="a"><stop stop-color="#48ddcf"/><stop offset="1" stop-color="#8c78ff"/></linearGradient></defs>
  <rect width="1200" height="480" rx="28" fill="url(#g)"/>
  <text x="56" y="70" fill="#64e5d6" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">KAPANIŞ SAATİ · 26 EKİM 2026</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="52" y="118" width="320" height="260" rx="24" fill="#172f55" stroke="#456080" stroke-width="2"/><text x="212" y="182" fill="#a9bddb" font-size="21" font-weight="700">VALVE SAATİ</text><text x="212" y="264" fill="#fff" font-size="62" font-weight="800">10.00</text><text x="212" y="318" fill="#a9bddb" font-size="19">Pasifik yaz saati (PDT)</text>
    <path d="M396 248h94" stroke="url(#a)" stroke-width="6" stroke-linecap="round"/><path d="m474 231 20 17-20 17" fill="none" stroke="#62e1d5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="440" y="118" width="320" height="260" rx="24" fill="#172f55" stroke="#456080" stroke-width="2"/><text x="600" y="182" fill="#a9bddb" font-size="21" font-weight="700">EŞGÜDÜMLÜ EVRENSEL</text><text x="600" y="264" fill="#fff" font-size="62" font-weight="800">17.00</text><text x="600" y="318" fill="#a9bddb" font-size="19">UTC</text>
    <path d="M784 248h94" stroke="url(#a)" stroke-width="6" stroke-linecap="round"/><path d="m862 231 20 17-20 17" fill="none" stroke="#62e1d5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="828" y="118" width="320" height="260" rx="24" fill="#123d4c" stroke="#50daca" stroke-width="3"/><text x="988" y="182" fill="#9cebe2" font-size="21" font-weight="700">TÜRKİYE (TRT)</text><text x="988" y="264" fill="#62e1d5" font-size="62" font-weight="800">20.00</text><text x="988" y="318" fill="#d0e7f2" font-size="19">UTC+3 · 26 Ekim Pazartesi</text>
  </g>
  <text x="600" y="438" text-anchor="middle" fill="#9db3d3" font-family="Arial,sans-serif" font-size="16">Valve, Ekim etkinliğinin 26 Ekim saat 10.00 PDT'de sona ereceğini belirtiyor.</text>
</svg>
