<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 340) rotate(90) scale(330)">
      <stop stop-color="#f87171" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Sık Yapılan 7 Hata</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Hepsi sipariş vermeden önce yakalanabilir</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="188" width="510" height="96" rx="12" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="96" y="226" font-size="20" font-weight="800" fill="#fca5a5">Soket uygunsuzluğu</text>
      <text x="96" y="254" font-size="17" fill="#e2e8f0">doğrusu: CPU soketi = anakart soketi</text>
      <rect x="70" y="296" width="510" height="96" rx="12" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="96" y="334" font-size="20" font-weight="800" fill="#fbbf24">Ucuz PSU seçimi</text>
      <text x="96" y="362" font-size="17" fill="#e2e8f0">doğrusu: 80+ Gold, bilinen marka</text>
      <rect x="70" y="404" width="510" height="96" rx="12" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="96" y="442" font-size="20" font-weight="800" fill="#c4b5fd">Tek modül RAM / XMP kapalı</text>
      <text x="96" y="470" font-size="17" fill="#e2e8f0">doğrusu: 2 modül + EXPO profili açık</text>
    </g>
    <g>
      <rect x="620" y="188" width="510" height="96" rx="12" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="646" y="226" font-size="20" font-weight="800" fill="#67e8f9">Soğutucuyu sıkmamak</text>
      <text x="646" y="254" font-size="17" fill="#e2e8f0">doğrusu: kılavuz sırası + düzgün macun</text>
      <rect x="620" y="296" width="510" height="96" rx="12" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="646" y="334" font-size="20" font-weight="800" fill="#86efac">Kapalı kasada test etmemek</text>
      <text x="646" y="362" font-size="17" fill="#e2e8f0">doğrusu: kapalı kasa + sıcaklık izleme</text>
      <rect x="620" y="404" width="510" height="96" rx="12" fill="#0c1526" stroke="#94a3b8" stroke-width="2"/>
      <text x="646" y="442" font-size="20" font-weight="800" fill="#cbd5e1">Bütçeyi GPU'ya yükleme</text>
      <text x="646" y="470" font-size="17" fill="#e2e8f0">doğrusu: GPU %35-45, işlemciye pay bırak</text>
    </g>

    <rect x="70" y="530" width="1060" height="48" rx="12" fill="#2a1215" stroke="#f87171" stroke-width="2"/>
    <text x="98" y="561" font-size="19" font-weight="700" fill="#fca5a5">Listeyi siparişten önce forumda paylaş: tek satırlık hata, bir iade sürecinden kurtarır</text>
  </g>
</svg>
