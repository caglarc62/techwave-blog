<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#111b35"/><text x="55" y="72" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Üç yanıt türü, üç farklı iş</text><g font-family="Arial,sans-serif"><g transform="translate(55 120)"><rect width="335" height="315" rx="22" fill="#192b4c" stroke="#36c8b5" stroke-width="2"/><circle cx="55" cy="57" r="25" fill="#164b50"/><text x="55" y="65" text-anchor="middle" fill="#6df4dc" font-size="20" font-weight="700">?</text><text x="32" y="115" fill="#6df4dc" font-size="15" font-weight="700">PREDICATE · KOŞUL</text><text x="32" y="160" fill="#fff" font-size="22" font-weight="700">Doğru mu?</text><text x="32" y="208" fill="#b5c4df" font-size="17">Bir iddia için 0–1 arası</text><text x="32" y="235" fill="#b5c4df" font-size="17">olasılık tahmini.</text><rect x="32" y="263" width="270" height="30" rx="15" fill="#29476b"/><rect x="32" y="263" width="205" height="30" rx="15" fill="#2bc4b0"/><text x="167" y="285" text-anchor="middle" fill="#0c1b31" font-size="15" font-weight="700">0.76 olasılık</text></g><g transform="translate(432 120)"><rect width="335" height="315" rx="22" fill="#1a294d" stroke="#7d83ee" stroke-width="2"/><circle cx="55" cy="57" r="25" fill="#30366c"/><text x="55" y="65" text-anchor="middle" fill="#c6c7ff" font-size="20" font-weight="700">A</text><text x="32" y="115" fill="#c6c7ff" font-size="15" font-weight="700">CHOICE · SEÇİM</text><text x="32" y="160" fill="#fff" font-size="22" font-weight="700">Hangisi?</text><text x="32" y="208" fill="#b5c4df" font-size="17">Verdiğiniz seçeneklerden</text><text x="32" y="235" fill="#b5c4df" font-size="17">birini döndürür.</text><rect x="32" y="263" width="270" height="30" rx="10" fill="#333d68"/><text x="167" y="284" text-anchor="middle" fill="#fff" font-size="15">teknik destek</text></g><g transform="translate(809 120)"><rect width="335" height="315" rx="22" fill="#202b4c" stroke="#e1a561" stroke-width="2"/><circle cx="55" cy="57" r="25" fill="#614524"/><text x="55" y="65" text-anchor="middle" fill="#ffd6a6" font-size="20" font-weight="700">1–5</text><text x="32" y="115" fill="#ffd6a6" font-size="15" font-weight="700">SCORE · PUAN</text><text x="32" y="160" fill="#fff" font-size="22" font-weight="700">Ne düzeyde?</text><text x="32" y="208" fill="#b5c4df" font-size="17">Sıralı seviyelere göre</text><text x="32" y="235" fill="#b5c4df" font-size="17">ağırlıklı puan.</text><g fill="#ffc779"><rect x="32" y="268" width="42" height="22" rx="6"/><rect x="81" y="259" width="42" height="31" rx="6"/><rect x="130" y="247" width="42" height="43" rx="6"/><rect x="179" y="232" width="42" height="58" rx="6"/><rect x="228" y="216" width="42" height="74" rx="6"/></g></g></g></svg>