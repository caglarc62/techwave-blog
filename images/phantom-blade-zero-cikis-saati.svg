<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Phantom Blade Zero Türkiye çıkış saati</title><desc id="desc">Oyunun 29 Ekim'de saat 10.00 Pekin saatinde başlayacağını ve Türkiye'de 05.00'e denk geldiğini gösterir.</desc>
