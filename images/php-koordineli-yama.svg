<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#0d2037"/><text x="60" y="65" fill="#e8f5ff" font-family="Arial" font-size="27" font-weight="700">Bir güvenlik yaması ekosistemin ortak işi</text><g font-family="Arial" text-anchor="middle"><path d="M255 235h155m130 0h155m130 0h155" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 9"/><g><circle cx="165" cy="235" r="75" fill="#123958" stroke="#38bdf8" stroke-width="3"/><text x="165" y="225" fill="#fff" font-size="20" font-weight="700">Araştırmacılar</text><text x="165" y="255" fill="#a5d9f2" font-size="15">bulguyu bildirir</text></g><g><circle cx="455" cy="235" r="75" fill="#17364f" stroke="#818cf8" stroke-width="3"/><text x="455" y="225" fill="#fff" font-size="20" font-weight="700">PHP bakımcıları</text><text x="455" y="255" fill="#c7d2fe" font-size="15">yamayı hazırlar</text></g><g><circle cx="745" cy="235" r="75" fill="#17364f" stroke="#34d399" stroke-width="3"/><text x="745" y="225" fill="#fff" font-size="20" font-weight="700">Sağlayıcılar</text><text x="745" y="255" fill="#bbf7d0" font-size="15">paketi dağıtır</text></g><g><circle cx="1035" cy="235" r="75" fill="#17364f" stroke="#fbbf24" stroke-width="3"/><text x="1035" y="225" fill="#fff" font-size="20" font-weight="700">Site yöneticisi</text><text x="1035" y="255" fill="#fde68a" font-size="15">kurar, doğrular</text></g></g><rect x="130" y="370" width="940" height="72" rx="18" fill="#15314a"/><text x="600" y="414" text-anchor="middle" fill="#b9d8eb" font-family="Arial" font-size="19">Bir halkanın atlanması, yamanın çalışan sistemde etkinleşmesini geciktirebilir.</text></svg>