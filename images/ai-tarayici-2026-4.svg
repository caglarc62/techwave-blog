<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#0e1a2b"/>
      <stop offset="1" stop-color="#123043"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(280)">
      <stop stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="listD" x1="560" y1="130" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151d33"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <rect x="70" y="208" width="8" height="150" rx="4" fill="#fbbf24"/>
  <text x="104" y="250" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fcd34d" letter-spacing="3">HIZLI BAŞLANGIÇ</text>
  <text x="104" y="312" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">5 Dakikada</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0">Doğru Seçim</text>

  <!-- adım paneli -->
  <rect x="560" y="130" width="560" height="340" rx="20" fill="url(#listD)" stroke="#1e293b" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22">
    <g>
      <circle cx="612" cy="190" r="20" fill="#fbbf24"/><text x="612" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">1</text>
      <text x="650" y="198" fill="#e2e8f0">Önceliğini belirle (hız/gizlilik)</text>
    </g>
    <g>
      <circle cx="612" cy="250" r="20" fill="#fbbf24"/><text x="612" y="258" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">2</text>
      <text x="650" y="258" fill="#e2e8f0">Uzantılarını kontrol et</text>
    </g>
    <g>
      <circle cx="612" cy="310" r="20" fill="#fbbf24"/><text x="612" y="318" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">3</text>
      <text x="650" y="318" fill="#e2e8f0">Gizlilik ayarlarını incele</text>
    </g>
    <g>
      <circle cx="612" cy="370" r="20" fill="#fbbf24"/><text x="612" y="378" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">4</text>
      <text x="650" y="378" fill="#e2e8f0">Ücretsiz planı dene</text>
    </g>
    <g>
      <circle cx="612" cy="430" r="20" fill="#4ade80"/><text x="612" y="438" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">5</text>
      <text x="650" y="438" fill="#e2e8f0">1 hafta kullan, sonra karar ver</text>
    </g>
  </g>

  <g fill="#fbbf24" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="490" cy="470" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
