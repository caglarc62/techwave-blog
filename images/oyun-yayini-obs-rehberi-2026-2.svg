<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 470) rotate(90) scale(280)">
      <stop stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">İnternetinize Göre Yayın Ayarı</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Yükleme hızının en fazla %70-80'ini kullanın</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="255" height="290" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="98" y="246" font-size="22" font-weight="800" fill="#86efac">10+ Mbps</text>
      <text x="98" y="286" font-size="19" font-weight="700" fill="#e2e8f0">1080p60</text>
      <g font-size="16" fill="#94a3b8">
        <text x="98" y="324">6000 – 8000 Kbps</text>
        <text x="98" y="354">ideal kalite</text>
        <text x="98" y="384">hızlı hareket için</text>
        <text x="98" y="414">en akıcı seçenek</text>
      </g>
      <text x="98" y="462" font-size="15" font-weight="700" fill="#64748b">öncelik: akıcılık</text>
    </g>
    <g>
      <rect x="345" y="200" width="255" height="290" rx="14" fill="#0c1526" stroke="#a3e635" stroke-width="2"/>
      <text x="373" y="246" font-size="22" font-weight="800" fill="#bef264">6 – 10 Mbps</text>
      <text x="373" y="286" font-size="19" font-weight="700" fill="#e2e8f0">1080p30 / 720p60</text>
      <g font-size="16" fill="#94a3b8">
        <text x="373" y="324">4500 – 6000 Kbps</text>
        <text x="373" y="354">çok kullanıcının</text>
        <text x="373" y="384">dengeli noktası</text>
        <text x="373" y="414">önerilen başlangıç</text>
      </g>
      <text x="373" y="462" font-size="15" font-weight="700" fill="#64748b">öncelik: denge</text>
    </g>
    <g>
      <rect x="620" y="200" width="255" height="290" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="648" y="246" font-size="22" font-weight="800" fill="#fbbf24">3 – 6 Mbps</text>
      <text x="648" y="286" font-size="19" font-weight="700" fill="#e2e8f0">720p60</text>
      <g font-size="16" fill="#94a3b8">
        <text x="648" y="324">3000 – 4500 Kbps</text>
        <text x="648" y="354">netlik yerine</text>
        <text x="648" y="384">akıcılık öncelikli</text>
        <text x="648" y="414">kare düşüşü olmaz</text>
      </g>
      <text x="648" y="462" font-size="15" font-weight="700" fill="#64748b">öncelik: kare hızı</text>
    </g>
    <g>
      <rect x="895" y="200" width="255" height="290" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="923" y="246" font-size="22" font-weight="800" fill="#fca5a5">3 Mbps altı</text>
      <text x="923" y="286" font-size="19" font-weight="700" fill="#e2e8f0">720p30 / 540p</text>
      <g font-size="16" fill="#94a3b8">
        <text x="923" y="324">1800 – 3000 Kbps</text>
        <text x="923" y="354">önce interneti</text>
        <text x="923" y="384">iyileştirin,</text>
        <text x="923" y="414">kaliteyi değil</text>
      </g>
      <text x="923" y="462" font-size="15" font-weight="700" fill="#64748b">öncelik: kararlılık</text>
    </g>

    <rect x="70" y="514" width="1080" height="52" rx="12" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
    <text x="98" y="547" font-size="20" font-weight="700" fill="#e2e8f9">Rekabetçi oyunlarda 720p60, 1080p30'dan daha iyi izlenir — hız, çözünürlükten önce gelir</text>
  </g>

  <g fill="#22d3ee" opacity="0.8"><circle cx="1155" cy="140" r="3"/><circle cx="420" cy="176" r="3"/></g>
</svg>
