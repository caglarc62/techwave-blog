<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 460) rotate(90) scale(300)">
      <stop stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">İzleyici Türleri</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Tek başına zararsız, birleşince bir profil</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="255" height="290" rx="18" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="116" cy="248" r="16" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="5 4"/>
      <text x="100" y="256" font-size="20" font-weight="800" fill="#67e8f9">C</text>
      <text x="98" y="326" font-size="24" font-weight="800" fill="#e2e8f0">Çerez</text>
      <text x="98" y="364" font-size="17" fill="#94a3b8">siteler arası sizi</text>
      <text x="98" y="390" font-size="17" fill="#94a3b8">tanıyan küçük kayıt</text>
      <text x="98" y="440" font-size="16" font-weight="700" fill="#67e8f9">Çözüm: çerez engeli</text>
    </g>
    <g>
      <rect x="345" y="200" width="255" height="290" rx="18" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <g stroke="#a855f7" stroke-width="3" fill="none">
        <circle cx="400" cy="248" r="18"/>
        <path d="M400 236 v24 M390 242 l20 12 M390 254 l20 -12"/>
      </g>
      <text x="373" y="326" font-size="24" font-weight="800" fill="#e2e8f0">Parmak izi</text>
      <text x="373" y="364" font-size="17" fill="#94a3b8">donanım ve ekran</text>
      <text x="373" y="390" font-size="17" fill="#94a3b8">özelliklerinden kimlik</text>
      <text x="373" y="440" font-size="16" font-weight="700" fill="#c4b5fd">Çözüm: sıkı mod</text>
    </g>
    <g>
      <rect x="620" y="200" width="255" height="290" rx="18" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <path d="M676 262 a20 20 0 1 1 36 -14 a16 16 0 1 1 -14 30 h-22 a18 18 0 0 1 0 -16" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="648" y="326" font-size="24" font-weight="800" fill="#e2e8f0">Zombi çerez</text>
      <text x="648" y="364" font-size="17" fill="#94a3b8">silinince tekrar</text>
      <text x="648" y="390" font-size="17" fill="#94a3b8">dirilen kayıt</text>
      <text x="648" y="440" font-size="16" font-weight="700" fill="#fbbf24">Çözüm: düzenli temizlik</text>
    </g>
    <g>
      <rect x="895" y="200" width="255" height="290" rx="18" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <rect x="923" y="232" width="52" height="36" rx="6" fill="none" stroke="#4ade80" stroke-width="3"/>
      <circle cx="949" cy="250" r="6" fill="#4ade80"/>
      <text x="923" y="326" font-size="24" font-weight="800" fill="#e2e8f0">İzleyici pikseli</text>
      <text x="923" y="364" font-size="17" fill="#94a3b8">gizli 1×1 görsel;</text>
      <text x="923" y="390" font-size="17" fill="#94a3b8">yüklenince haber verir</text>
      <text x="923" y="440" font-size="16" font-weight="700" fill="#86efac">Çözüm: görsel engeli</text>
    </g>
  </g>

  <text x="70" y="546" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">Sorun tek izleyici değil; binlerce sitenin aynı profilde birleşmesi</text>
  <g fill="#a855f7" opacity="0.8"><circle cx="1155" cy="130" r="4"/><circle cx="620" cy="176" r="3"/></g>
</svg>
