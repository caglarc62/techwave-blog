<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Yapay zekâ pilotu için karar adımları</title><desc id="desc">Pilot iş yükünü seçme, erişimi doğrulama, sonuç ve maliyeti ölçme, veri koşullarını inceleme ve üretim kararı verme adımları.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#173047"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".3"/></filter></defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/><text x="64" y="76" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">KONTROLLÜ DEĞERLENDİRME</text><text x="64" y="124" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Önizlemeden üretim kararına</text>
<path d="M132 250H1066" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/><g fill="#0f172a" stroke="#67e8f9" stroke-width="4"><circle cx="132" cy="250" r="27"/><circle cx="366" cy="250" r="27"/><circle cx="600" cy="250" r="27"/><circle cx="834" cy="250" r="27"/><circle cx="1068" cy="250" r="27"/></g><g fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle"><text x="132" y="256">1</text><text x="366" y="256">2</text><text x="600" y="256">3</text><text x="834" y="256">4</text><text x="1068" y="256">5</text></g>
<g filter="url(#shadow)" fill="#fff"><rect x="48" y="308" width="168" height="118" rx="18"/><rect x="282" y="308" width="168" height="118" rx="18"/><rect x="516" y="308" width="168" height="118" rx="18"/><rect x="750" y="308" width="168" height="118" rx="18"/><rect x="984" y="308" width="168" height="118" rx="18"/></g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#0f172a" font-size="17" font-weight="750"><text x="132" y="350"><tspan x="132">İş yükünü</tspan><tspan x="132" dy="23">seç</tspan></text><text x="366" y="350"><tspan x="366">Erişimi</tspan><tspan x="366" dy="23">doğrula</tspan></text><text x="600" y="350"><tspan x="600">Kalite ve</tspan><tspan x="600" dy="23">maliyeti ölç</tspan></text><text x="834" y="350"><tspan x="834">Veri koşullarını</tspan><tspan x="834" dy="23">incele</tspan></text><text x="1068" y="350"><tspan x="1068">Üretim kararını</tspan><tspan x="1068" dy="23">ver</tspan></text></g><g fill="#64748b" font-size="13"><text x="132" y="405">Gerçek bir senaryo</text><text x="366" y="405">Model, bölge, proje</text><text x="600" y="405">Aynı ölçütlerle kıyas</text><text x="834" y="405">Saklama ve erişim</text><text x="1068" y="405">Risk ve taşınabilirlik</text></g></g>
<text x="64" y="474" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">Önerilen kontrol akışı • Önizleme erişimi, üretim uygunluğu veya hizmet düzeyi garantisi değildir.</text></svg>