<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldC" x1="770" y1="170" x2="1020" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#34d399"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6ee7b7" letter-spacing="3">ETİK VE YASAL</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Sınır Nerede?</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">robots.txt ve adil kullanım</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Hız sınırı · kimlik · veri güvenliği</text>

  <!-- kalkan -->
  <path d="M890 170 L1050 222 V330 C1050 412 985 470 890 498 C795 470 730 412 730 330 V222 Z"
        fill="url(#shieldC)" fill-opacity="0.15" stroke="url(#shieldC)" stroke-width="4"/>
  <!-- onay işareti -->
  <path d="M828 320 L876 368 L962 268" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- robots.txt rozetleri -->
  <g font-family="Inter, Arial, sans-serif" font-weight="700">
    <rect x="560" y="474" width="248" height="46" rx="23" fill="#0b1220" stroke="#4ade80" stroke-width="2"/>
    <text x="684" y="504" text-anchor="middle" font-size="20" fill="#4ade80">Allow: /</text>
    <rect x="824" y="474" width="248" height="46" rx="23" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="948" y="504" text-anchor="middle" font-size="20" fill="#fcd34d">Rate limit</text>
  </g>

  <g fill="#34d399" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="480" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
