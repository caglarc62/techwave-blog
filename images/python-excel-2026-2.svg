<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(330)">
      <stop stop-color="#4ade80" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Hangi Araç Ne Yapar?</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Hesap pandas'ta, biçim openpyxl'de</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="190" width="340" height="150" rx="14" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="98" y="234" font-size="24" font-weight="800" fill="#67e8f9">pandas</text>
      <g font-size="17" fill="#94a3b8">
        <text x="98" y="272">okuma · filtre · groupby</text>
        <text x="98" y="302">birleştirme · pivot özet</text>
      </g>
    </g>
    <g>
      <rect x="430" y="190" width="340" height="150" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="458" y="234" font-size="24" font-weight="800" fill="#86efac">openpyxl</text>
      <g font-size="17" fill="#94a3b8">
        <text x="458" y="272">formül + renk + birleşik</text>
        <text x="458" y="302">şablonu korur, biçimi bozmaz</text>
      </g>
    </g>
    <g>
      <rect x="790" y="190" width="340" height="150" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="818" y="234" font-size="24" font-weight="800" fill="#fbbf24">csv (stdlib)</text>
      <g font-size="17" fill="#94a3b8">
        <text x="818" y="272">kurulum gerektirmez</text>
        <text x="818" y="302">küçük dosyalar için yeter</text>
      </g>
    </g>

    <g>
      <rect x="70" y="370" width="1060" height="160" rx="16" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
      <text x="100" y="414" font-size="22" font-weight="800" fill="#e2e8f9">Kurulum: 3 komut</text>
      <g font-size="19" fill="#e2e8f0" font-family="Consolas, monospace">
        <text x="100" y="456">python -m venv venv</text>
        <text x="100" y="490">venv\Scripts\activate</text>
        <text x="100" y="524">pip install pandas openpyxl</text>
      </g>
    </g>
  </g>
</svg>
