<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#101a30"/>
      <stop offset="1" stop-color="#14284a"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 300) rotate(90) scale(300)">
      <stop stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <rect x="70" y="208" width="8" height="150" rx="4" fill="#38bdf8"/>
  <text x="104" y="250" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#7dd3fc" letter-spacing="3">ÖNCE BUNLAR</text>
  <text x="104" y="312" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">En Yüksek</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#e2e8f0">Getiriyi Sağlayan 4 Ayar</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Sıralama önemlidir</text>

  <!-- 4 ayar karti -->
  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="550" y="130" width="570" height="82" rx="14" fill="#132033" stroke="#a855f7" stroke-width="2"/>
      <text x="582" y="166" font-size="24" font-weight="800" fill="#c4b5fd">1 · Çözünürlüğü düşür</text>
      <text x="582" y="196" font-size="20" fill="#94a3b8">1080p → 900p hızlı kazanç sağlar</text>
    </g>
    <g>
      <rect x="550" y="226" width="570" height="82" rx="14" fill="#132033" stroke="#38bdf8" stroke-width="2"/>
      <text x="582" y="262" font-size="24" font-weight="800" fill="#7dd3fc">2 · Gölgeleri kıs</text>
      <text x="582" y="292" font-size="20" fill="#94a3b8">En pahalı ayar genelde gölgedir</text>
    </g>
    <g>
      <rect x="550" y="322" width="570" height="82" rx="14" fill="#132033" stroke="#4ade80" stroke-width="2"/>
      <text x="582" y="358" font-size="24" font-weight="800" fill="#4ade80">3 · Kare hızını sınırla</text>
      <text x="582" y="388" font-size="20" fill="#94a3b8">VSync yerine 60/144 kilidi</text>
    </g>
    <g>
      <rect x="550" y="418" width="570" height="82" rx="14" fill="#132033" stroke="#fbbf24" stroke-width="2"/>
      <text x="582" y="454" font-size="24" font-weight="800" fill="#fcd34d">4 · Arka planı temizle</text>
      <text x="582" y="484" font-size="20" fill="#94a3b8">Tarayıcı ve yayın programları</text>
    </g>
  </g>

  <g fill="#38bdf8" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="520" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
