<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA1" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 320) rotate(90) scale(340)">
      <stop stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeA1" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA1)"/>
  <rect width="1200" height="600" fill="url(#glowA1)"/>

  <text x="70" y="104" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Koddan yayına tek otomatik hat</text>
  <text x="70" y="146" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">GitHub Actions: her push'ta test et, kur, dağıt — elle dokunma.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="230" width="152" height="96" rx="14" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
    <text x="146" y="272" font-size="26" text-anchor="middle" font-weight="800" fill="#67e8f9">Kod</text>
    <text x="146" y="302" font-size="16" text-anchor="middle" fill="#94a3b8">git commit</text>

    <rect x="286" y="230" width="152" height="96" rx="14" fill="#0c1526" stroke="#334155" stroke-width="2"/>
    <text x="362" y="272" font-size="26" text-anchor="middle" font-weight="800" fill="#e2e8f0">Push</text>
    <text x="362" y="302" font-size="16" text-anchor="middle" fill="#94a3b8">main dalı</text>

    <rect x="502" y="214" width="196" height="128" rx="14" fill="#101a33" stroke="url(#pipeA1)" stroke-width="2"/>
    <text x="600" y="258" font-size="26" text-anchor="middle" font-weight="800" fill="#ffffff">Actions</text>
    <text x="600" y="286" font-size="16" text-anchor="middle" fill="#94a3b8">workflow tetiklenir</text>
    <text x="600" y="312" font-size="16" text-anchor="middle" fill="#67e8f9">runner: ubuntu</text>

    <rect x="762" y="230" width="152" height="96" rx="14" fill="#0c1526" stroke="#34d399" stroke-width="2"/>
    <text x="838" y="272" font-size="26" text-anchor="middle" font-weight="800" fill="#6ee7b7">Test ✓</text>
    <text x="838" y="302" font-size="16" text-anchor="middle" fill="#94a3b8">pytest · lint</text>

    <rect x="978" y="230" width="152" height="96" rx="14" fill="#0c1526" stroke="#a78bfa" stroke-width="2"/>
    <text x="1054" y="272" font-size="26" text-anchor="middle" font-weight="800" fill="#c4b5fd">Deploy</text>
    <text x="1054" y="302" font-size="16" text-anchor="middle" fill="#94a3b8">otomatik yayın</text>

    <line x1="222" y1="278" x2="286" y2="278" stroke="url(#pipeA1)" stroke-width="3"/>
    <line x1="438" y1="278" x2="502" y2="278" stroke="url(#pipeA1)" stroke-width="3"/>
    <line x1="698" y1="278" x2="762" y2="278" stroke="url(#pipeA1)" stroke-width="3"/>
    <line x1="914" y1="278" x2="978" y2="278" stroke="url(#pipeA1)" stroke-width="3"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="420" width="1060" height="110" rx="14" fill="#0a1120" stroke="#334155" stroke-width="1.5"/>
    <text x="98" y="462" font-size="20" font-weight="700" fill="#e2e8f0">Elle yapılan her tekrar, bir gün atlanan bir adama mal olur.</text>
    <text x="98" y="498" font-size="18" fill="#94a3b8">CI/CD zinciri: hatayı üretimden önce yakalar, yayını monoton hale getirir.</text>
    <circle cx="1088" cy="475" r="22" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
    <text x="1088" y="483" font-size="24" text-anchor="middle" fill="#67e8f9" font-weight="800">✓</text>
  </g>
</svg>
