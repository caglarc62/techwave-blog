<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 470) rotate(90) scale(280)">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">İyi Promptun Altı Bileşeni</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Hangisi eksikse, sonuç o kadar bulanık</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="200" width="340" height="130" rx="14" fill="#0c1526" stroke="#22d3ee" stroke-width="2"/>
      <text x="98" y="246" font-size="24" font-weight="800" fill="#67e8f9">1 · Rol</text>
      <text x="98" y="284" font-size="17" fill="#94a3b8">"Bir vergi uzmanı gibi yanıtla"</text>
      <text x="98" y="310" font-size="16" fill="#64748b">perspektifi sabitler</text>
    </g>
    <g>
      <rect x="430" y="200" width="340" height="130" rx="14" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
      <text x="458" y="246" font-size="24" font-weight="800" fill="#c4b5fd">2 · Bağlam</text>
      <text x="458" y="284" font-size="17" fill="#94a3b8">kim, nerede, hangi amaçla</text>
      <text x="458" y="310" font-size="16" fill="#64748b">arka planı taşır</text>
    </g>
    <g>
      <rect x="790" y="200" width="340" height="130" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="818" y="246" font-size="24" font-weight="800" fill="#86efac">3 · Görev</text>
      <text x="818" y="284" font-size="17" fill="#94a3b8">"3 aylık içerik planı hazırla"</text>
      <text x="818" y="310" font-size="16" fill="#64748b">yapılacak işi tanımlar</text>
    </g>
    <g>
      <rect x="70" y="350" width="340" height="130" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
      <text x="98" y="396" font-size="24" font-weight="800" fill="#fbbf24">4 · Kısıt</text>
      <text x="98" y="434" font-size="17" fill="#94a3b8">"ücretli reklam önerme, Türkçe"</text>
      <text x="98" y="460" font-size="16" fill="#64748b">sınırları çizer</text>
    </g>
    <g>
      <rect x="430" y="350" width="340" height="130" rx="14" fill="#0c1526" stroke="#f87171" stroke-width="2"/>
      <text x="458" y="396" font-size="24" font-weight="800" fill="#fca5a5">5 · Format</text>
      <text x="458" y="434" font-size="17" fill="#94a3b8">"madde madde, en fazla 10"</text>
      <text x="458" y="460" font-size="16" fill="#64748b">çıktının şeklini söyler</text>
    </g>
    <g>
      <rect x="790" y="350" width="340" height="130" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
      <text x="818" y="396" font-size="24" font-weight="800" fill="#86efac">6 · Örnek</text>
      <text x="818" y="434" font-size="17" fill="#94a3b8">"şu iki örnek gibi olsun: ..."</text>
      <text x="818" y="460" font-size="16" fill="#64748b">en hızlı iyileştiren madde</text>
    </g>
  </g>

  <text x="70" y="546" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">Görev + kısıt + format üçlüsü, neredeyse her şablonun omurgasıdır</text>
  <g fill="#22d3ee" opacity="0.8"><circle cx="1155" cy="140" r="3"/><circle cx="420" cy="176" r="3"/></g>
</svg>
