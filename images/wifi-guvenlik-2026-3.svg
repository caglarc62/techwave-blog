<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelC" x1="550" y1="130" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151d33"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#34d399"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6ee7b7" letter-spacing="3">YÖNETİM PANELİ</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Modeminize</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Girin ve Kontrol Edin</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">192.168.1.1 · firmware · bağlı cihazlar</text>

  <!-- tarayici paneli -->
  <rect x="550" y="130" width="570" height="340" rx="20" fill="url(#panelC)" stroke="#1e293b" stroke-width="2"/>
  <rect x="550" y="130" width="570" height="48" rx="20" fill="#0a1120"/>
  <circle cx="582" cy="154" r="7" fill="#ef4444"/>
  <circle cx="606" cy="154" r="7" fill="#f59e0b"/>
  <circle cx="630" cy="154" r="7" fill="#22c55e"/>
  <rect x="656" y="141" width="440" height="26" rx="13" fill="#1e293b"/>
  <text x="678" y="160" font-family="Consolas, Menlo, monospace" font-size="16" fill="#64748b">http://192.168.1.1</text>

  <g font-family="Inter, Arial, sans-serif" font-size="21">
    <g>
      <circle cx="596" cy="226" r="16" fill="#4ade80"/>
      <path d="M589 226 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="628" y="233" fill="#e2e8f0">Firmware güncel mi?</text>
    </g>
    <g>
      <circle cx="596" cy="284" r="16" fill="#4ade80"/>
      <path d="M589 284 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="628" y="291" fill="#e2e8f0">Bağlı cihazları tanıyor musunuz?</text>
    </g>
    <g>
      <circle cx="596" cy="342" r="16" fill="#4ade80"/>
      <path d="M589 342 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="628" y="349" fill="#e2e8f0">Yönetim arayüzü dışa kapalı mı?</text>
    </g>
    <g>
      <circle cx="596" cy="400" r="16" fill="#4ade80"/>
      <path d="M589 400 l5 5 l9 -10" stroke="#0b1220" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="628" y="407" fill="#e2e8f0">WPS kapalı mı?</text>
    </g>
    <g>
      <circle cx="596" cy="452" r="16" fill="#fbbf24"/>
      <text x="596" y="459" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1220">!</text>
      <text x="628" y="459" fill="#e2e8f0">DNS sunucusu değiştirildi mi?</text>
    </g>
  </g>

  <g fill="#34d399" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="490" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
