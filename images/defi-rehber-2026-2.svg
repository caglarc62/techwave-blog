<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(330)">
      <stop stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgB)"/>
  <rect width="1200" height="600" fill="url(#glowB)"/>

  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Bir Takas 5 Adımda</text>
  <text x="70" y="148" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">İşlem zincre yazılır, komisyon kodla belirlenir</text>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="190" width="660" height="64" rx="12" fill="#132033" stroke="#a855f7" stroke-width="1.5"/>
      <text x="96" y="230" font-size="19" fill="#e2e8f0"><tspan font-weight="800" fill="#c4b5fd">1 · </tspan>Takas arayüzü: fiyat + kaydırma oranı</text>
      <rect x="70" y="266" width="660" height="64" rx="12" fill="#132033" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="96" y="306" font-size="19" fill="#e2e8f0"><tspan font-weight="800" fill="#67e8f9">2 · </tspan>Cüzdan onayı: harcanacak tutarı oku</text>
      <rect x="70" y="342" width="660" height="64" rx="12" fill="#132033" stroke="#4ade80" stroke-width="1.5"/>
      <text x="96" y="382" font-size="19" fill="#e2e8f0"><tspan font-weight="800" fill="#86efac">3 · </tspan>İşlem zincre yazılır · blok süresi</text>
      <rect x="70" y="418" width="660" height="64" rx="12" fill="#132033" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="96" y="458" font-size="19" fill="#e2e8f0"><tspan font-weight="800" fill="#fbbf24">4 · </tspan>Sözleşme havuzla takası yapar (AMM)</text>
      <rect x="70" y="494" width="660" height="64" rx="12" fill="#132033" stroke="#a855f7" stroke-width="1.5"/>
      <text x="96" y="534" font-size="19" fill="#e2e8f0"><tspan font-weight="800" fill="#c4b5fd">5 · </tspan>Bakiye güncellenir · gas ayrı ödenir</text>
    </g>

    <g>
      <rect x="770" y="190" width="360" height="368" rx="16" fill="#132033" stroke="#1e3a5f" stroke-width="2"/>
      <text x="800" y="234" font-size="22" font-weight="800" fill="#e2e8f9">İki İpucu</text>
      <g font-size="18" fill="#e2e8f0">
        <text x="800" y="282">• Kaydırma toleransını</text>
        <text x="800" y="310" fill="#94a3b8">dar tut: %0,5 üzeri fazladır</text>
        <text x="800" y="358">• Onay (approve) ayrı işlemdir;</text>
        <text x="800" y="386" fill="#94a3b8">geniş yetki yerine</text>
        <text x="800" y="414" fill="#94a3b8">tutar bazlı yetki ver</text>
      </g>
      <rect x="800" y="452" width="300" height="88" rx="10" fill="#0f2b1e" stroke="#4ade80" stroke-width="1.5"/>
      <text x="824" y="486" font-size="17" font-weight="700" fill="#86efac">APY ne kadar yüksekse</text>
      <text x="824" y="514" font-size="17" font-weight="700" fill="#86efac">dayanıklılık o kadar kısa</text>
    </g>
  </g>
</svg>
