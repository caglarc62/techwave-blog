<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(280)">
      <stop stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldC" x1="760" y1="170" x2="1010" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shineC" x1="770" y1="180" x2="920" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#22d3ee"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#67e8f9" letter-spacing="3">KORUNMA</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Güvenli Yapı</text>
  <text x="104" y="358" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#94a3b8">İzin · denetim · izolasyon</text>

  <!-- kalkan -->
  <path d="M880 170 L1040 222 V330 C1040 412 975 470 880 498 C785 470 720 412 720 330 V222 Z"
        fill="url(#shieldC)" fill-opacity="0.16" stroke="url(#shieldC)" stroke-width="4"/>
  <path d="M880 170 L1040 222 V330 C1040 412 975 470 880 498 C785 470 720 412 720 330 V222 Z"
        fill="url(#shineC)"/>
  <!-- kilit -->
  <rect x="838" y="296" width="84" height="72" rx="12" fill="#0b1220" stroke="#67e8f9" stroke-width="4"/>
  <path d="M856 296 v-20 a24 24 0 0 1 48 0 v20" stroke="#67e8f9" stroke-width="6" fill="none"/>
  <circle cx="880" cy="326" r="9" fill="#4ade80"/>

  <!-- ilkeler rozetleri -->
  <g font-family="Inter, Arial, sans-serif" font-weight="700">
    <rect x="560" y="470" width="150" height="46" rx="23" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="635" y="500" text-anchor="middle" font-size="22" fill="#67e8f9">En az yetki</text>
    <rect x="726" y="470" width="150" height="46" rx="23" fill="#0b1220" stroke="#4ade80" stroke-width="2"/>
    <text x="801" y="500" text-anchor="middle" font-size="22" fill="#4ade80">Onay akışı</text>
    <rect x="892" y="470" width="150" height="46" rx="23" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="967" y="500" text-anchor="middle" font-size="22" fill="#fcd34d">Kayıt (log)</text>
  </g>

  <g fill="#22d3ee" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="470" r="4"/><circle cx="1160" cy="140" r="3"/></g>
</svg>
