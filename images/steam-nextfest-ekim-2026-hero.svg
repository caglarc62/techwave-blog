    <rect x="55" y="47" width="132" height="86" rx="16" fill="#1c4f67"/><path d="M55 111l42-38 28 23 20-18 42 42H55Z" fill="#48d9c7"/><circle cx="154" cy="72" r="10" fill="#ffcf78"/>
    <rect x="209" y="54" width="126" height="14" rx="7" fill="#293b58"/><rect x="209" y="81" width="100" height="9" rx="4.5" fill="#9aa8bc"/><rect x="209" y="100" width="114" height="9" rx="4.5" fill="#c4ccda"/>
    <rect x="55" y="157" width="280" height="48" rx="13" fill="#e8edfa"/><text x="74" y="188" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#24304b">DEMOYU DENE · İSTEK LİSTESİNE EKLE</text>
