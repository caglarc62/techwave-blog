<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Steam Next Fest Ekim 2026 son gün rehberi</title>
  <desc id="desc">Oyun kumandası, demo kartları ve Türkiye saatiyle 20.00 kapanışını gösteren TechWave çizimi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081b35"/><stop offset="1" stop-color="#142957"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0d1"/><stop offset="1" stop-color="#8a69ff"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030916" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="600" rx="34" fill="url(#bg)"/>
  <circle cx="1010" cy="72" r="220" fill="#6b5cff" opacity=".12"/><circle cx="1140" cy="530" r="260" fill="#29d9c7" opacity=".08"/>
  <path d="M0 452C182 385 280 505 430 474s220-141 370-91 250 71 400-4v221H0Z" fill="#09152c" opacity=".68"/>
