    <text x="72" y="205" font-size="64" font-weight="800">STEAM NEXT</text>
    <text x="72" y="276" font-size="64" font-weight="800">FEST BİTİYOR</text>
    <text x="78" y="333" fill="#c4d3ee" font-size="25" font-weight="500">Son demoları seç, süreyi iyi kullan.</text>
    <rect x="76" y="382" width="280" height="70" rx="18" fill="#15385a" stroke="#42ddcf" stroke-width="2"/>
    <text x="100" y="410" fill="#9db5d5" font-size="14" font-weight="700" letter-spacing="2">TÜRKİYE SAATİYLE</text>
    <text x="99" y="441" fill="#62e1d5" font-size="27" font-weight="800">26 EKİM · 20.00</text>
  </g>
  <g filter="url(#shadow)" transform="translate(690 120)">
