  <g fill="#42ddcf" opacity=".85"><circle cx="629" cy="149" r="7"/><circle cx="1088" cy="345" r="5"/><circle cx="641" cy="395" r="4"/><path d="M1055 110l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/></g>
