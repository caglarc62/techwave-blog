<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(280)">
      <stop stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldC" x1="760" y1="170" x2="1010" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shineC" x1="770" y1="180" x2="920" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#34d399"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6ee7b7" letter-spacing="3">GİZLİLİK NOTU</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Veriniz Nereye</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">Gidiyor?</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Özetleme ≠ sunucuya gönderme</text>

  <!-- kalkan -->
  <path d="M880 170 L1040 222 V330 C1040 412 975 470 880 498 C785 470 720 412 720 330 V222 Z"
        fill="url(#shieldC)" fill-opacity="0.16" stroke="url(#shieldC)" stroke-width="4"/>
  <path d="M880 170 L1040 222 V330 C1040 412 975 470 880 498 C785 470 720 412 720 330 V222 Z"
        fill="url(#shineC)"/>
  <!-- göz ikonu -->
  <path d="M795 300 C825 262 935 262 965 300 C935 338 825 338 795 300 Z" fill="#0b1220" stroke="#6ee7b7" stroke-width="4"/>
  <circle cx="880" cy="300" r="20" fill="#6ee7b7"/>
  <circle cx="880" cy="300" r="8" fill="#0b1220"/>
  <!-- çapraz -->
  <path d="M760 210 L1000 470" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <g font-family="Inter, Arial, sans-serif" font-weight="700">
    <rect x="560" y="474" width="230" height="46" rx="23" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="675" y="504" text-anchor="middle" font-size="21" fill="#67e8f9">Yerel işlem</text>
    <rect x="806" y="474" width="230" height="46" rx="23" fill="#0b1220" stroke="#4ade80" stroke-width="2"/>
    <text x="921" y="504" text-anchor="middle" font-size="21" fill="#4ade80">Açık politika</text>
  </g>

  <g fill="#34d399" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="480" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
