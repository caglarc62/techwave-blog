<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) rotate(90) scale(320)">
      <stop stop-color="#a3e635" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgD)"/>
  <rect width="1200" height="600" fill="url(#glowD)"/>

  <text x="70" y="110" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">İlk Yayın Ses Dengesi</text>
  <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Kötü görüntü izlenir; kötü ses izlenmez</text>

  <!-- ses cubuklari -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="70" y="200" width="700" height="90" rx="14" fill="#0c1526" stroke="#4ade80" stroke-width="2"/>
    <text x="100" y="242" font-size="22" font-weight="800" fill="#86efac">Konuşma (mikrofon)</text>
    <rect x="100" y="258" width="480" height="18" rx="9" fill="#132033"/>
    <rect x="100" y="258" width="380" height="18" rx="9" fill="#4ade80"/>
    <text x="600" y="274" font-size="18" font-weight="700" fill="#86efac">≈ –6 dB</text>

    <rect x="70" y="306" width="700" height="90" rx="14" fill="#0c1526" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="348" font-size="22" font-weight="800" fill="#fbbf24">Oyun sesi</text>
    <rect x="100" y="364" width="480" height="18" rx="9" fill="#132033"/>
    <rect x="100" y="364" width="260" height="18" rx="9" fill="#f59e0b"/>
    <text x="600" y="380" font-size="18" font-weight="700" fill="#fbbf24">–10…–15 dB</text>

    <rect x="70" y="412" width="700" height="90" rx="14" fill="#0c1526" stroke="#a855f7" stroke-width="2"/>
    <text x="100" y="454" font-size="22" font-weight="800" fill="#c4b5fd">Arka plan müziği</text>
    <rect x="100" y="470" width="480" height="18" rx="9" fill="#132033"/>
    <rect x="100" y="470" width="140" height="18" rx="9" fill="#a855f7"/>
    <text x="600" y="486" font-size="18" font-weight="700" fill="#c4b5fd">–20 dB altı</text>

    <rect x="810" y="200" width="320" height="302" rx="16" fill="#132033" stroke="#22d3ee" stroke-width="2"/>
    <text x="840" y="246" font-size="21" font-weight="800" fill="#67e8f9">4 Altın Kural</text>
    <g font-size="17" fill="#e2e8f0">
      <text x="840" y="290">1 · Yayında kulaklık</text>
      <text x="840" y="330">2 · Gürültü kesici filtre</text>
      <text x="840" y="370">3 · Push-to-talk (gerekirse)</text>
      <text x="840" y="410">4 · Tek tek kısarak denge</text>
    </g>
    <g font-size="16" fill="#94a3b8">
      <text x="840" y="452">hoparlör → yankı</text>
      <text x="840" y="478">klavye + fan sesi kesilir</text>
    </g>
  </g>

  <text x="70" y="556" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#64748b">Öncelik: mikrofon, kulaklıktan önce gelir — ses bozulursa izleyici çıkar</text>
</svg>
