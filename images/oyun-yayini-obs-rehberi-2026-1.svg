<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#a3e635" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA)"/>
  <rect width="1200" height="600" fill="url(#glowA)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#a3e635"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#bef264" letter-spacing="3">OYUN · YAYIN</text>
  <text x="104" y="310" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Oyun Yayını Nasıl Yapılır?</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">OBS ile Twitch ve YouTube</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Kurulum · Bitrate · Ses · Sahne · Donma çözümleri</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="620" y="130" width="510" height="330" rx="18" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
    <text x="652" y="176" font-size="20" font-weight="700" fill="#64748b" letter-spacing="3">YAYIN ZİNCİRİ</text>

    <g>
      <rect x="652" y="200" width="446" height="56" rx="10" fill="#132033" stroke="#a3e635" stroke-width="1.5"/>
      <text x="676" y="235" font-size="19" fill="#e2e8f0">Oyun → OBS (yakalama kaynağı)</text>
      <rect x="652" y="268" width="446" height="56" rx="10" fill="#132033" stroke="#a855f7" stroke-width="1.5"/>
      <text x="676" y="303" font-size="19" fill="#e2e8f0">Ses miksajı → konuşma + oyun dengesi</text>
      <rect x="652" y="336" width="446" height="56" rx="10" fill="#132033" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="676" y="371" font-size="19" fill="#e2e8f0">Kodlayıcı (NVENC) → bitrate uyumu</text>
      <rect x="652" y="404" width="446" height="40" rx="10" fill="#132033" stroke="#22d3ee" stroke-width="2"/>
      <text x="676" y="431" font-size="19" font-weight="700" fill="#67e8f9">İnternet → Twitch / YouTube</text>
    </g>
  </g>

  <g fill="#a3e635" opacity="0.85"><circle cx="150" cy="130" r="4"/><circle cx="540" cy="500" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
