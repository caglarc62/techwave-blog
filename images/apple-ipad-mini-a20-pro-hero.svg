    <rect x="70" y="453" width="310" height="54" rx="14" fill="#ffffff" opacity=".08"/><text x="92" y="487" fill="#d7e1f4" font-size="18" font-weight="700">ÖN SİPARİŞ: 28 EKİM</text>
