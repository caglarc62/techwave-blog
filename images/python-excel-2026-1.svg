<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(890 300) rotate(90) scale(310)">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgA)"/>
  <rect width="1200" height="600" fill="url(#glowA)"/>

  <rect x="70" y="204" width="8" height="170" rx="4" fill="#22d3ee"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#67e8f9" letter-spacing="3">PYTHON · VERİ İŞLEME</text>
  <text x="104" y="310" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Excel ve CSV ile Çalışmak</text>
  <text x="104" y="362" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">pandas + openpyxl Rehberi</text>
  <text x="104" y="410" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Oku · Temizle · Özetle · Yaz</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="640" y="130" width="490" height="340" rx="18" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
    <text x="672" y="176" font-size="20" font-weight="700" fill="#64748b" letter-spacing="3">4 ADIMLI AKIŞ</text>

    <g>
      <rect x="672" y="196" width="426" height="52" rx="10" fill="#132033" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="694" y="228" font-size="17" fill="#e2e8f0"><tspan font-weight="800" fill="#67e8f9">1 · OKU </tspan> read_excel / read_csv</text>
      <rect x="672" y="256" width="426" height="52" rx="10" fill="#132033" stroke="#4ade80" stroke-width="1.5"/>
      <text x="694" y="288" font-size="17" fill="#e2e8f0"><tspan font-weight="800" fill="#86efac">2 · TEMİZLE </tspan> tip + eksik + tekrar</text>
      <rect x="672" y="316" width="426" height="52" rx="10" fill="#132033" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="694" y="348" font-size="17" fill="#e2e8f0"><tspan font-weight="800" fill="#fbbf24">3 · ÖZETLE </tspan> groupby / pivot_table</text>
      <rect x="672" y="376" width="426" height="52" rx="10" fill="#132033" stroke="#a855f7" stroke-width="1.5"/>
      <text x="694" y="408" font-size="17" fill="#e2e8f0"><tspan font-weight="800" fill="#c4b5fd">4 · YAZ </tspan> ExcelWriter · 3 sayfa</text>
      <rect x="672" y="440" width="426" height="30" rx="8" fill="#0f2b1e" stroke="#4ade80" stroke-width="1.5"/>
      <text x="694" y="461" font-size="16" font-weight="700" fill="#86efac">Kural: ham dosyanın üstüne yazma</text>
    </g>
  </g>

  <g fill="#22d3ee" opacity="0.85"><circle cx="150" cy="130" r="4"/><circle cx="540" cy="510" r="4"/><circle cx="1160" cy="120" r="3"/></g>
</svg>
