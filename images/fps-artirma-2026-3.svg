<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#122740"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 300) rotate(90) scale(300)">
      <stop stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gaugeC" x1="740" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgC)"/>
  <rect width="1200" height="600" fill="url(#glowC)"/>

  <rect x="70" y="204" width="8" height="160" rx="4" fill="#34d399"/>
  <text x="104" y="246" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#6ee7b7" letter-spacing="3">DONANIM</text>
  <text x="104" y="308" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Isı, Saat ve</text>
  <text x="104" y="360" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0">Sürücü Güncelliği</text>
  <text x="104" y="408" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Throttling, boost modu, sürücü</text>

  <!-- sicaklik olcer -->
  <rect x="600" y="150" width="480" height="300" rx="20" fill="#0c1526" stroke="#1e3a5f" stroke-width="2"/>
  <text x="632" y="196" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#64748b">GPU SICAKLIĞI</text>
  <text x="1048" y="196" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#34d399">68°C</text>

  <rect x="632" y="224" width="416" height="22" rx="11" fill="#1e293b"/>
  <rect x="632" y="224" width="262" height="22" rx="11" fill="url(#gaugeC)"/>
  <g font-family="Inter, Arial, sans-serif" font-size="19">
    <text x="632" y="284" fill="#94a3b8">Soğutma yeterli</text>
    <text x="1048" y="284" text-anchor="end" fill="#4ade80">✓</text>
    <text x="632" y="326" fill="#94a3b8">Sürücü güncel</text>
    <text x="1048" y="326" text-anchor="end" fill="#4ade80">✓</text>
    <text x="632" y="368" fill="#94a3b8">Güç planı: Yüksek performans</text>
    <text x="1048" y="368" text-anchor="end" fill="#4ade80">✓</text>
    <text x="632" y="410" fill="#94a3b8">Arka plan uygulamaları</text>
    <text x="1048" y="410" text-anchor="end" fill="#fbbf24">!</text>
  </g>

  <g fill="#34d399" opacity="0.9"><circle cx="150" cy="130" r="4"/><circle cx="500" cy="480" r="4"/><circle cx="1160" cy="130" r="3"/></g>
</svg>
